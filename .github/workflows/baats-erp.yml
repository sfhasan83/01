name: BAATS ERP

on:
  push:
    paths: ['baats-erp/**', '.github/workflows/baats-erp.yml']
  pull_request:
    paths: ['baats-erp/**', '.github/workflows/baats-erp.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baats-erp
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: baats-erp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
