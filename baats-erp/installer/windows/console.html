// Read a chosen receipt file as base64 for a claim (a phone shrinks photos itself; here the file must already be small).
const readReceipt = (file) => new Promise((resolve, reject) => {
  if (!file) return resolve(null);
  if (file.size > 750000) return reject(new Error('The receipt is larger than 750 KB. Save it smaller or use BAATS Mobile, which shrinks photos.'));
  const r = new FileReader(); r.onload = () => resolve({ fileName: file.name, contentType: file.type || 'application/octet-stream', dataBase64: String(r.result).split(',')[1] });

});

const readText = (file) => new Promise((resolve, reject) => {
  if (!file) return reject(new Error('choose a file first'));
  if (file.size > 15 * 1048576) return reject(new Error('the file is larger than 15 MB; split it into smaller files'));
  if (/\.xls$/i.test(file.name)) return reject(new Error('this is an old Excel file (.xls). In Excel use File, Save As, "Excel Workbook (.xlsx)" or "CSV UTF-8 (Comma delimited)", and choose that file'));
  if (/\.xlsx$/i.test(file.name)) return reject(new Error('this is an Excel workbook; this file has to be JSON or CSV'));
  const r = new FileReader(); r.onload = () => resolve(String(r.result)); r.onerror = () => reject(new Error('could not read the file')); r.readAsText(file, 'utf-8');
});
/** A file as base64, for JSON uploads. */
const readBase64 = (file, maxMb = 15) => new Promise((resolve, reject) => {
  if (!file) return reject(new Error('choose a file first'));
  if (file.size > maxMb * 1048576) return reject(new Error(`the file is larger than ${maxMb} MB`));
  const r = new FileReader(); r.onload = () => resolve(String(r.result).replace(/^data:[^,]*,/, '')); r.onerror = () => reject(new Error('could not read the file')); r.readAsDataURL(file);
});
const saveBlob = (url, name) => { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000); };
const bytes = (n) => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;
function importResult(r, kindTitle) {
  const head = r.errors.length ? `<b style="color:var(--bad)">${r.errors.length} problem${r.errors.length === 1 ? '' : 's'} found; nothing was saved.</b> Fix them in the file and check again.`

      : `<b style="color:var(--ok)">The file is fine.</b> Importing it would add ${r.created} and skip ${r.skipped} already in BAATS.${r.journalNo ? ` It would post ${esc(r.journalNo)}.` : ''} Nothing has been saved yet.`;
  const rowsOf = (list) => '<div class="tbl"><table><tr><th>Row</th><th>Problem</th></tr>' + list.map((e) => `<tr><td>${e.row || ''}</td><td>${esc(e.message)}</td></tr>`).join('') + '</table></div>';
  return `<div class="card" style="border-color:${r.errors.length ? 'var(--bad)' : 'var(--ok)'}"><h4>${esc(kindTitle)}: ${r.rows} row${r.rows === 1 ? '' : 's'} read</h4><p>${head}</p>
    ${r.errors.length ? rowsOf(r.errors) : ''}${r.warnings.length ? `<p class="muted">Please note:</p>${rowsOf(r.warnings)}` : ''}
    ${!r.errors.length && !r.saved ? '<div class="row"><button class="btn" id="imp-go">Import it</button></div>' : ''}</div>`;
}

    $('#ba-read').onclick = async () => {

        out.querySelectorAll('[data-ba-get]').forEach((el) => el.onclick = () => saveBlob(URL.createObjectURL(new Blob(['﻿' + r[el.dataset.baGet]], { type: 'text/csv' })), `baats-accounting-${el.dataset.baGet}.csv`));
        out.querySelectorAll('[data-ba-check]').forEach((el) => el.onclick = async () => {
          try { await check(r[el.dataset.baCheck], `BAATS Accounting ${el.dataset.baCheck}`, el.dataset.baCheck); $('#imp-out').scrollIntoView({ behavior: 'smooth' }); } catch (e) { toast(e.message, false); }
        });
      } catch (e) { toast(e.message, false); }

  async backup(m, ok) {
    const mk = $('#bk-make');
    if (mk) mk.onclick = async () => { mk.disabled = true; mk.textContent = 'Making the backup...'; try { const r = await api('POST', '/local/backups'); ok(`Backup made: ${bytes(r.bytes)}, ${r.rows.toLocaleString()} records`); } catch (e) { mk.disabled = false; toast(e.message, false); } };
    m.querySelectorAll('[data-bk-get]').forEach((el) => el.onclick = async () => { try { saveBlob(await authFetch(`/local/backups/${encodeURIComponent(el.dataset.bkGet)}`), el.dataset.bkGet); } catch (e) { toast(e.message, false); } });
    // After a restore the sign-ins are those of the backup, so the console signs in again.
    const done = (r) => {
      $('#bk-out').innerHTML = `<div class="card" style="border-color:var(--ok)"><b>Restored the backup of ${esc(when(r.backupOf))}</b> (${r.rows.toLocaleString()} records, made with BAATS ${esc(r.fromVersion)}${r.updatedWith.length ? `, brought up to this version` : ''}). Signing you in again...</div>`;
      setTimeout(() => { S = null; sessionStorage.removeItem('baats'); render(); toast('Restore finished. Please sign in again.'); }, 2500);
    };
    const confirmRestore = (what) => prompt(`Restore ${what}?\n\nEverything done since it was made is undone, for every user. The data as it is now is backed up first.\n\nType RESTORE to go ahead.`) === 'RESTORE';
    m.querySelectorAll('[data-bk-restore]').forEach((el) => el.onclick = async () => {
      if (!confirmRestore(`the backup of ${el.closest('tr').firstElementChild.textContent}`)) return;
      el.disabled = true; $('#bk-out').innerHTML = '<p class="muted">Restoring; this takes a few seconds to a few minutes...</p>';
      try { done(await api('POST', `/local/restore?name=${encodeURIComponent(el.dataset.bkRestore)}&confirm=RESTORE`)); } catch (e) { el.disabled = false; $('#bk-out').innerHTML = ''; toast(e.message, false); }
    });
    const up = $('#bk-upload');
    if (up) up.onclick = async () => {
      const f = $('#bk-file').files[0]; if (!f) return toast('Choose a backup file first', false);
      if (!confirmRestore(f.name)) return;
      up.disabled = true; $('#bk-out').innerHTML = '<p class="muted">Sending the file and restoring...</p>';
      try {
        const pass = $('#bk-pass').value;
        const r = await fetch('/local/restore?confirm=RESTORE', { method: 'POST', headers: { authorization: 'Bearer ' + S.token, 'content-type': 'application/octet-stream', ...(pass ? { 'x-backup-passphrase': pass } : {}) }, body: f });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.message || 'HTTP ' + r.status);
        done(d);
      } catch (e) { up.disabled = false; $('#bk-out').innerHTML = ''; toast(e.message, false); }
    };
    bindBackupExtras(m, ok);
  },

  async security(m, ok) {
    m.querySelectorAll('[data-ss-end]').forEach((el) => el.onclick = async () => { try { await api('DELETE', `/v1/me/sessions/${el.dataset.ssEnd}`); ok('Signed out there'); } catch (e) { toast(e.message, false); } });
    const o = $('#ss-others'); if (o) o.onclick = async () => { try { const r = await api('POST', '/v1/me/sessions/revoke-others'); ok(`Signed out of ${r.revoked} other sign-in${r.revoked === 1 ? '' : 's'}`); } catch (e) { toast(e.message, false); } };
    const ms = $('#mfa-start');
    if (ms) ms.onclick = async () => {
      try {
        const e = await api('POST', '/v1/auth/mfa/enrol');
        $('#mfa-out').innerHTML = `<p>In the app, add an account and choose to enter a setup key. Account: your email. Key (time based):</p><pre style="font-size:18px;letter-spacing:2px;white-space:pre-wrap;word-break:break-all">${esc(e.secret.replace(/(.{4})/g, '$1 ').trim())}</pre>
          <p class="muted">Some apps can open this link instead: <code style="word-break:break-all">${esc(e.otpauthUrl)}</code></p>
          <form id="f-mfa"><div class="grid">${field('code', 'The 6-digit code the app now shows', 'required inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code"')}</div><div class="row"><button class="btn">Switch it on</button></div></form>`;
        bindForm('f-mfa', async (b) => { await api('POST', '/v1/auth/mfa/confirm', { code: b.code }); ok('Authenticator app on. Next time you sign in, BAATS asks for its code.'); });
      } catch (e) { toast(e.message, false); }
    };
    bindForm('f-pw', async (b, el) => {
      if (b.next !== b.again) throw new Error('the new passwords are not the same');
      await api('POST', '/v1/me/password', { current: b.current, next: b.next });
      el.reset(); ok('Password changed. You are signed out everywhere else.');
    });
  },

  async access(m, ok) {
    m.querySelectorAll('[data-pw-reset]').forEach((el) => el.onclick = async () => {
      const pw = prompt(`New password for ${el.dataset.email} (at least 12 characters). They are signed out everywhere and a locked account is unlocked. Give them the password in person and ask them to change it under My sessions and password.`);
      if (!pw) return;
      try { await api('POST', `/v1/iam/users/${el.dataset.pwReset}/password`, { password: pw }); ok(`Password set for ${el.dataset.email}`); } catch (e) { toast(e.message, false); }
    });
  },
});

// A receipt image for the demo, drawn here so the demo needs no files.
function demoReceipt(lines) {
  const cv = document.createElement('canvas'); cv.width = 360; cv.height = 120 + lines.length * 28;
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#111';
  g.font = 'bold 20px monospace'; g.fillText(lines[0], 20, 40); g.font = '16px monospace';
  lines.slice(1).forEach((l, i) => g.fillText(l, 20, 80 + i * 28));
  return { fileName: 'receipt.jpg', contentType: 'image/jpeg', dataBase64: cv.toDataURL('image/jpeg', 0.85).split(',')[1] };
}

async function downloadFile(path, fallbackName) {
  const r = await fetch(path, { headers: { authorization: 'Bearer ' + S.token } });
  if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.message || 'HTTP ' + r.status); }
  const name = /filename="([^"]+)"/.exec(r.headers.get('content-disposition') || '')?.[1] || fallbackName;
  saveBlob(URL.createObjectURL(await r.blob()), name);
}

    bindForm('f-mailtest', async (b) => { const o = $('#mail-test-out'); o.textContent = 'Sending...'; const r = await api('POST', '/v1/int/mail/test', { to: b.to }); o.innerHTML = r.sent ? `<span style="color:var(--ok)">Sent.</span> ${esc(r.answer || '')}` : `<span style="color:var(--bad)">Not sent: ${esc(r.answer)}</span>`; });
    bindForm('f-sso', async (b) => {
      const body = { kind: b.kind, clientId: b.clientId, clientSecret: b.clientSecret, ...(b.name ? { name: b.name } : {}), ...(b.msTenant ? { msTenant: b.msTenant } : {}), ...(b.issuer ? { issuer: b.issuer } : {}) };
      if (b.allowedDomains) body.allowedDomains = b.allowedDomains.split(/[,;\s]+/).filter(Boolean);
      await api('POST', '/v1/iam/sso-providers', body); ok('Sign-in provider added. Its button shows on the sign-in page.');
    });
    bindForm('f-gw', async (b) => { const body = { active: b.active, ...(b.secretKey ? { secretKey: b.secretKey } : {}), ...(b.webhookSecret ? { webhookSecret: b.webhookSecret } : {}) }; await api('PUT', `/v1/fin/companies/${S.company}/payment-gateway`, body); ok('Card payments saved'); });
    const on = (attr, fn) => m.querySelectorAll(`[data-${attr}]`).forEach((el) => el.onclick = async () => { try { await fn(el.getAttribute(`data-${attr}`)); } catch (e) { toast(e.message, false); } });
    on('mail-resend', async (id) => { await api('POST', `/v1/int/mail/${id}/resend`); ok('Queued again'); });
    on('sso-off', async (id) => { await api('PATCH', `/v1/iam/sso-providers/${id}`, { active: false }); ok('Turned off'); });
    on('sso-on', async (id) => { await api('PATCH', `/v1/iam/sso-providers/${id}`, { active: true }); ok('Turned on'); });
    on('sso-del', async (id) => { if (!confirm('Remove this sign-in provider? People who use it will need a BAATS password.')) return; await api('DELETE', `/v1/iam/sso-providers/${id}`); ok('Removed'); });
    bindLinkActions(m, ok);
  },
});

// ---------- Running BAATS as a service: backups that leave this PC, subscription, the operator's pages ----------
function backupExtras(b) {
  const d = b.drills || [];
  return `<div class="card"><h3>Encryption and a second copy</h3>
    <p>${b.encrypting ? '<b style="color:var(--ok)">Backups are encrypted.</b> A downloaded or copied backup cannot be read without the passphrase; keep it somewhere safe, away from this computer, because without it the backups cannot be restored anywhere else.' : '<b>Backups are not encrypted.</b> Anyone with a backup file can read all your data. Set a passphrase to encrypt the next ones (AES-256).'}</p>
    <form id="f-bkpass"><div class="grid">${field('passphrase', b.encrypting ? 'New passphrase (12 characters or more)' : 'Passphrase (12 characters or more)', 'type="password" minlength="12" autocomplete="new-password"')}${field('again', 'The passphrase again', 'type="password" autocomplete="new-password"')}</div>
      <div class="row"><button class="btn sec">${b.encrypting ? 'Change the passphrase' : 'Encrypt backups'}</button>${b.encrypting ? ' <button type="button" class="btn sec" id="bk-plain">Stop encrypting</button>' : ''}</div></form>
    <p>${b.copyDir ? `Every backup is also copied to <code>${esc(b.copyDir)}</code>.` : 'Backups are only on this computer.'} Choose a folder on another disk, a network share, or a OneDrive, Google Drive or Dropbox folder, so a copy survives if this computer does not.</p>
    <form id="f-bkcopy"><div class="grid">${field('copyDir', 'Second folder (full path, e.g. D:\\\\BAATS backups)', `value="${esc(b.copyDir || '')}"`)}</div><div class="row"><button class="btn sec">Save the folder</button>${b.copyDir ? ' <button type="button" class="btn sec" id="bk-nocopy">Stop copying</button>' : ''}</div></form></div>
  <div class="card"><h3>Restore drills</h3><p>A backup is only worth something if it can be restored. A drill restores a backup beside your data (which is not touched), recomputes every organization's audit trail and checks that every posted journal balances, then removes it again. BAATS runs one on the newest backup every week; run one now with "Restore drill" on any backup above.</p>
    ${d.length ? '<div class="tbl"><table><tr><th>When</th><th>Backup</th><th>Result</th><th style="text-align:right">Records</th><th style="text-align:right">Seconds</th><th>Checked</th></tr>' + d.map((x) => `<tr><td>${esc(when(x.at))}</td><td>${esc(x.backup)}</td><td>${x.ok ? '<b style="color:var(--ok)">passed</b>' : `<b style="color:var(--bad)">failed</b> ${esc((x.problems || []).join('; '))}`}</td><td style="text-align:right">${x.rows ? x.rows.toLocaleString() : ''}</td><td style="text-align:right">${x.seconds ?? ''}</td><td>${(x.tenants || []).map((t) => `${esc(t.code)}: ${t.auditEntries} audit entries`).join(', ')}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No drill yet.</div>'}</div>`;
}
function bindBackupExtras(m, ok) {
  bindForm('f-bkpass', async (b) => {
    if (!b.passphrase || b.passphrase.length < 12) throw new Error('the passphrase needs at least 12 characters');
    if (b.passphrase !== b.again) throw new Error('the two passphrases are not the same');
    await api('POST', '/local/backups/settings', { passphrase: b.passphrase }); ok('Saved. The next backups are encrypted with this passphrase.');
  });
  const plain = $('#bk-plain'); if (plain) plain.onclick = async () => { if (!confirm('Stop encrypting backups? The next ones can be read by anyone who has the file.')) return; try { await api('POST', '/local/backups/settings', { passphrase: null }); ok('Backups are no longer encrypted'); } catch (e) { toast(e.message, false); } };
  bindForm('f-bkcopy', async (b) => { if (!b.copyDir) throw new Error('give the folder'); await api('POST', '/local/backups/settings', { copyDir: b.copyDir }); ok('Every backup is now copied there too'); });
  const nc = $('#bk-nocopy'); if (nc) nc.onclick = async () => { try { await api('POST', '/local/backups/settings', { copyDir: null }); ok('No more copies'); } catch (e) { toast(e.message, false); } };
  m.querySelectorAll('[data-bk-drill]').forEach((el) => el.onclick = async () => {
    el.disabled = true; el.textContent = 'Restoring and checking...';
    try { const r = await api('POST', `/local/backups/drill?name=${encodeURIComponent(el.dataset.bkDrill)}`); if (r.ok) ok(`Drill passed: ${r.rows.toLocaleString()} records restored and checked in ${r.seconds} s`); else { toast(`Drill failed: ${(r.problems || []).join('; ')}`, false); show(current); } } catch (e) { el.disabled = false; toast(e.message, false); }
  });
}

const PLAN_STATUS = { trial: 'free trial', active: 'active', past_due: 'payment overdue', suspended: 'suspended', cancelled: 'cancelled' };
const usersOf = (p) => `${p.included_users} users included${p.extra_user_price ? `, then ${money(p.extra_user_price, p.currency)} ${esc(p.currency)} each` : ''}${p.max_users ? ` (up to ${p.max_users})` : ''}`;
Object.assign(pages, {
  async subscription() {
    const s = await api('GET', '/v1/subscription');
    const days = s.trialEndsAt ? Math.ceil((Date.parse(s.trialEndsAt) - Date.now()) / 86_400_000) : null;
    return `<div class="card"><h3>Your subscription: ${esc(s.plan.name)}</h3>
      <p>Status: <b style="color:${s.writable ? 'var(--ok)' : 'var(--bad)'}">${esc(PLAN_STATUS[s.status] || s.status)}</b>${s.status === 'trial' ? (days > 0 ? `, ${days} day${days === 1 ? '' : 's'} left (until ${esc(s.trialEndsAt.slice(0, 10))})` : '') : ''}${s.billingEmail ? ` · invoices go to ${esc(s.billingEmail)}` : ''}</p>
      ${s.reason ? `<p style="color:var(--bad)">${esc(s.reason)}. Everything can still be read, reported and exported; nothing can be changed until then.</p>` : ''}
      <p class="muted">${s.plan.billable ? `${money(s.plan.monthly_price, s.plan.currency)} ${esc(s.plan.currency)} a month, ${usersOf(s.plan)}` : esc(s.plan.name)}${s.plan.max_companies ? `; up to ${s.plan.max_companies} ${s.plan.max_companies === 1 ? 'company' : 'companies'} with books` : ''}.</p>
      <h4>Use this month</h4>${report([{ ...s.usage, documentBytes: bytes(s.usage.documentBytes) }], [['users', 'Active users'], ['usersSignedIn', 'Signed in this month'], ['companies', 'Companies with books'], ['invoices', 'Invoices posted'], ['journals', 'Journals posted'], ['documentBytes', 'Documents stored']])}</div>
    <div class="card"><h3>Invoices from BAATS</h3>${s.invoices.length ? report(s.invoices.map((i) => ({ ...i, issued_on: d10(i.issued_on), due_on: d10(i.due_on), status: i.status === 'open' && i.due_on.slice(0, 10) < today() ? 'overdue' : i.status })),
      [['no', 'Invoice'], ['period', 'Month'], ['plan_code', 'Plan'], ['users', 'Users'], ['extra_users', 'Extra users'], ['issued_on', 'Issued'], ['due_on', 'Due'], ['status', 'Status'], ['total', 'Total', 1]]) : '<div class="empty">None yet.</div>'}</div>
    <div class="card"><h3>Plans</h3>${report(s.plans.filter((p) => p.billable).map((p) => ({ ...p, users: usersOf(p), companies: p.max_companies ?? 'any number' })), [['name', 'Plan'], ['users', 'Users'], ['companies', 'Companies'], ['monthly_price', 'A month', 1]])}
      <p class="muted">To change plan, contact BAATS; the change takes effect at once and the next invoice follows it.</p></div>`;
  },
  async operator() {
    let ts;
    try { ts = await api('GET', '/local/platform/tenants'); } catch (e) {
      return `<div class="card"><h3>Service operator</h3><p>${/sys\.platform/.test(e.message) ? 'Only someone with the sys.platform permission can operate the service.' : 'The operator pages work in the BAATS ERP program on the computer that runs it. On a server, use the platform API with the platform key (see the README).'}</p></div>`;
    }
    const [plans, invs] = await Promise.all([api('GET', '/local/platform/plans'), api('GET', '/local/platform/billing/invoices')]);
    const last = new Date(); last.setDate(0);
    return `<div class="card"><h3>Organizations on this server</h3><p class="muted">Each organization (tenant) has a subscription. Trials end by themselves; an invoice not paid by its due date makes the subscription "payment overdue", and ${14} days later it is suspended: the organization can still read and export everything but change nothing, until it pays. Organizations made in this trial program are on the on-premises licence, which has no limits.</p>
      <div class="tbl"><table><tr><th>Code</th><th>Name</th><th>Plan</th><th>Status</th><th>Trial ends</th><th style="text-align:right">Users</th><th style="text-align:right">Companies</th><th style="text-align:right">Invoices this month</th><th style="text-align:right">Owed</th><th></th></tr>
      ${ts.map((t) => `<tr><td>${esc(t.code)}</td><td>${esc(t.name)}</td><td>${esc(t.subscription?.planName || '')}</td><td>${esc(PLAN_STATUS[t.subscription?.status] || '')}${t.subscription && !t.subscription.writable ? ' <b style="color:var(--bad)">(read-only)</b>' : ''}</td><td>${esc((t.subscription?.trialEndsAt || '').slice(0, 10))}</td><td style="text-align:right">${t.usage.users}</td><td style="text-align:right">${t.usage.companies}</td><td style="text-align:right">${t.usage.invoices}</td><td style="text-align:right">${t.owed ? money(t.owed) : ''}</td><td>${act('Change', 'op-sub', t.id, 1)}</td></tr>`).join('')}</table></div>
      <form id="f-opsub" style="display:none"><h4 id="opsub-title"></h4><div class="grid">${pick('plan', 'Plan', [['', '(keep)'], ...plans.filter((p) => p.active).map((p) => [p.code, p.name])])}${pick('status', 'Status', [['', '(keep)'], ['active', 'Active'], ['trial', 'Free trial'], ['suspended', 'Suspended'], ['cancelled', 'Cancelled']])}${field('trialEndsAt', 'Trial ends', 'type="date"')}${field('billingEmail', 'Billing email', 'type="email"')}</div><input type="hidden" name="tenant"><div class="row"><button class="btn">Save</button></div></form></div>
    <div class="card"><h3>Billing</h3><p class="muted">Bill a month: every organization on a paid plan that is active or overdue gets one invoice for the plan and the users above what it includes. A month is billed once; running it again adds nothing. On a server, AUTO_BILLING=true bills last month by itself.</p>
      <form id="f-bill"><div class="grid">${field('period', 'Month', `type="month" required value="${last.toISOString().slice(0, 7)}"`)}</div><div class="row"><button class="btn">Bill this month</button><button type="button" class="btn sec" id="op-sweep">Update overdue subscriptions now</button></div></form>
      ${invs.length ? '<div class="tbl"><table><tr><th>Invoice</th><th>Organization</th><th>Month</th><th>Plan</th><th style="text-align:right">Users</th><th style="text-align:right">Total</th><th>Due</th><th>Status</th><th></th></tr>' + invs.map((i) => `<tr><td>${esc(i.no)}</td><td>${esc(i.tenantName)}</td><td>${esc(i.period)}</td><td>${esc(i.plan_code)}</td><td style="text-align:right">${i.users}${i.extra_users ? ` (+${i.extra_users})` : ''}</td><td style="text-align:right">${money(i.total, i.currency)} ${esc(i.currency)}</td><td>${d10(i.due_on)}</td><td>${esc(i.status)}${i.payment_ref ? ' · ' + esc(i.payment_ref) : ''}</td><td>${i.status === 'open' ? `<button class="btn sec" data-op-paid="${i.id}" data-tenant="${i.tenantId}">Mark paid</button> <button class="btn sec" data-op-void="${i.id}" data-tenant="${i.tenantId}">Void</button>` : ''}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No invoices yet.</div>'}</div>
    <div class="card"><h3>Plans</h3>${report(plans.map((p) => ({ ...p, users: usersOf(p), companies: p.max_companies ?? 'any', trial: p.trial_days ? `${p.trial_days} days` : '', on: p.active ? 'yes' : 'no', billed: p.billable ? 'yes' : 'no' })), [['code', 'Code'], ['name', 'Name'], ['users', 'Users'], ['companies', 'Companies'], ['trial', 'Trial'], ['billed', 'Billed'], ['on', 'Offered'], ['monthly_price', 'A month', 1]])}
      <form id="f-plan"><h4>Add or change a plan</h4><div class="grid">${field('code', 'Code (e.g. BUSINESS)', 'required pattern="[A-Z][A-Z0-9_]{1,30}"')}${field('name', 'Name')}${field('monthlyPrice', 'Price a month', 'type="number" step="any" min="0"')}${field('currency', 'Currency', 'maxlength="3" value="AED"')}${field('includedUsers', 'Users included', 'type="number" min="0"')}${field('extraUserPrice', 'Price per extra user', 'type="number" step="any" min="0"')}${field('maxUsers', 'Most users (empty: no limit)', 'type="number" min="1"')}${field('maxCompanies', 'Most companies (empty: no limit)', 'type="number" min="1"')}${field('trialDays', 'Trial days', 'type="number" min="0"')}${check('active', 'Offered', true)}</div><div class="row"><button class="btn sec">Save plan</button></div></form></div>`;
  },
});
Object.assign(after, {
  async subscription() {},
  async operator(m, ok) {
    const f = $('#f-opsub');
    m.querySelectorAll('[data-op-sub]').forEach((el) => el.onclick = () => { f.style.display = ''; f.tenant.value = el.dataset.opSub; $('#opsub-title').textContent = `Change ${el.closest('tr').children[1].textContent}`; f.scrollIntoView({ behavior: 'smooth' }); });
    bindForm('f-opsub', async (b) => { const id = b.tenant; delete b.tenant; if (!Object.keys(b).length) throw new Error('change something first'); await api('PATCH', `/local/platform/tenants/${id}/subscription`, b); ok('Subscription changed'); });
    bindForm('f-bill', async (b) => { const r = await api('POST', '/local/platform/billing/run', { period: b.period }); ok(r.invoices.length ? `Billed ${b.period}: ${r.invoices.length} invoice${r.invoices.length === 1 ? '' : 's'}` : `Nothing to bill for ${b.period}`); });
    $('#op-sweep').onclick = async () => { try { const r = await api('POST', '/local/platform/billing/sweep'); ok(r.changed.length ? r.changed.map((c) => `${c.tenant}: ${PLAN_STATUS[c.status]}`).join(', ') : 'Nothing changed'); } catch (e) { toast(e.message, false); } };
    m.querySelectorAll('[data-op-paid],[data-op-void]').forEach((el) => el.onclick = async () => {
      const paid = !!el.dataset.opPaid; const id = el.dataset.opPaid || el.dataset.opVoid;
      const reference = paid ? prompt('Payment reference (bank transfer, cheque number)', '') : null; if (paid && reference === null) return;
      if (!paid && !confirm('Void this invoice?')) return;
      try { await api('POST', `/local/platform/tenants/${el.dataset.tenant}/invoices/${id}/settle`, { action: paid ? 'paid' : 'void', ...(reference ? { reference } : {}) }); ok(paid ? 'Marked paid' : 'Voided'); } catch (e) { toast(e.message, false); }
    });
    bindForm('f-plan', async (b) => {
      const code = b.code; const body = { active: b.active };
      if (b.name) body.name = b.name; if (b.currency) body.currency = b.currency.toUpperCase();
      for (const k of ['monthlyPrice', 'extraUserPrice']) if (b[k] !== undefined) body[k] = Number(b[k]);
      for (const k of ['includedUsers', 'maxUsers', 'maxCompanies', 'trialDays']) if (b[k] !== undefined) body[k] = Number(b[k]);
      await api('PUT', `/local/platform/plans/${code}`, body); ok(`Plan ${code} saved`);
    });
  },
});
/** A bar over every page while the organization cannot change data, or its trial is ending. */
async function subscriptionBar() {
  const bar = $('#subbar'); if (!bar || !S) return;
  try {
    const s = await api('GET', '/v1/subscription');
    const days = s.trialEndsAt ? Math.ceil((Date.parse(s.trialEndsAt) - Date.now()) / 86_400_000) : null;
    const msg = !s.writable ? `${s.reason}. You can read and export everything, but not change anything.` : s.status === 'trial' && days <= 7 ? `Your free trial ends in ${days} day${days === 1 ? '' : 's'}.` : s.status === 'past_due' ? 'An invoice from BAATS is overdue; please pay it to avoid suspension.' : '';
    bar.style.display = msg ? '' : 'none'; bar.textContent = msg;
  } catch { bar.style.display = 'none'; }
}

function render() {
  const a = $('#app');
  $('#logout').style.display = S ? '' : 'none';
  $('#who').textContent = S ? `${S.email} @ ${S.tenant}` : '';
  if (CARD_RETURN && S) { toast(CARD_RETURN.paid ? `The card payment for ${CARD_RETURN.paid} went through. The receipt is recorded within two minutes.` : 'The card payment was not completed.'); CARD_RETURN = null; }
  if (!S && CARD_RETURN) { a.innerHTML = cardReturnView(); $('#card-done').onclick = () => { CARD_RETURN = null; render(); }; return; }
  if (!S) { a.innerHTML = authView(); afterAuthBind(); return; }
  if (!S.email) api('GET', '/v1/me').then((me) => { S.email = me.user.email; sessionStorage.setItem('baats', JSON.stringify(S)); $('#who').textContent = `${S.email} @ ${S.tenant}`; }).catch(() => {});
  a.innerHTML = `<div id="subbar" style="display:none;background:var(--bad);color:#fff;padding:8px 16px"></div><div class="wrap"><nav>${MENU.map(([k, t]) => `<button data-p="${k}">${t}</button>`).join('')}</nav><main></main></div>`;
  a.querySelectorAll('nav button').forEach((b) => b.onclick = () => show(b.dataset.p));
  show(current);
  subscriptionBar();
}
$('#logout').onclick = async () => { try { await api('POST', '/v1/auth/logout'); } catch { /* ignore */ } S = null; sessionStorage.removeItem('baats'); render(); };
fetch('/local/ping').then((r) => r.json()).then((d) => { $('#ver').textContent = 'Trial console · ' + d.version; }).catch(() => {});
render();
</script>
