    m.querySelectorAll('[data-ana-bd]').forEach((el) => el.onclick = async () => { A.bd = el.dataset.anaBd; const y = window.scrollY; await show('analytics'); window.scrollTo(0, y); });
    m.querySelectorAll('[data-ana-tile]').forEach((el) => el.onchange = () => { const c = el.dataset.anaTile; A.draft = el.checked ? [...A.draft, c] : A.draft.filter((x) => x !== c); show('analytics'); });
    m.querySelectorAll('[data-ana-drop]').forEach((el) => el.onclick = () => { A.draft = A.draft.filter((x) => x !== el.dataset.anaDrop); show('analytics'); });
    const move = (i, d) => { const t = [...A.draft]; [t[i], t[i + d]] = [t[i + d], t[i]]; A.draft = t; show('analytics'); };
    m.querySelectorAll('[data-ana-up]').forEach((el) => el.onclick = () => move(Number(el.dataset.anaUp), -1));
    m.querySelectorAll('[data-ana-down]').forEach((el) => el.onclick = () => move(Number(el.dataset.anaDown), 1));
    on('ana-save', 'onclick', async () => { try { await api('PUT', `/v1/bi/companies/${S.company}/dashboard/layout`, { tiles: A.draft, period: A.period, compare: A.compare, ...(A.period === 'custom' ? { from: A.from, to: A.to } : {}) }); A.editing = false; A.draft = null; toast('Layout saved'); show('analytics'); } catch (e) { toast(e.message, false); } });
    on('ana-reset', 'onclick', async () => { try { const l = await api('DELETE', `/v1/bi/companies/${S.company}/dashboard/layout`); Object.assign(A, { editing: false, draft: null, period: l.period, compare: l.compare }); toast('Back to the default layout'); show('analytics'); } catch (e) { toast(e.message, false); } });
  },
});


// Saudi demo: a second company in Saudi Arabia, filled through the public API like the main demo.
async function loadSaudiDemo(step) {
  const us = await units(); const root = us.find((u) => u.depth === 0) || us[0];
  let sa = us.find((u) => u.code === 'SA-DEMO');
  if (!sa) { step('Adding the Saudi company...'); sa = await api('POST', '/v1/org/units', { typeCode: 'company', parentId: root.id, code: 'SA-DEMO', name: 'BAATS Arabia', countryCode: 'SA', currencyCode: 'SAR' }); }
  const co = sa.id;
  const books = await api('GET', `/v1/fin/companies/${co}/accounts`).catch(() => []);
  if (!books.length) { step('Setting up Saudi books (chart, 15% VAT, GOSI rules)...'); await api('POST', '/v1/fin/companies', { unitId: co, legalName: 'BAATS Arabia LLC', taxRegistrationNo: '310000000000003', openFrom: yearStart() }); }
  await api('PATCH', `/v1/fin/companies/${co}`, { street: 'King Fahd Road', buildingNo: '2121', district: 'Al Olaya', city: 'Riyadh', postalCode: '12211', tradeLicenceNo: '1010987654', iban: 'SA0380000000608010167519', email: 'finance@baats-arabia.example' });
  step('Signing in the approver...');
  const pw = 'Approver-Demo-2026', appEmail = `approver@${S.tenant}.demo`;
  if (!(await api('GET', '/v1/iam/users')).find((u) => u.email === appEmail)) {
    const approver = await api('POST', '/v1/iam/users', { email: appEmail, displayName: 'Demo Approver', password: pw });
    const roles = await api('GET', '/v1/iam/roles');
    await api('POST', '/v1/iam/assignments', { userId: approver.id, roleId: roles.find((r) => r.code === 'TENANT_ADMIN').id, scopeUnitId: root.id, includeDescendants: true });
  }
  const asApprover = async (fn) => {
    const l = await api('POST', '/v1/auth/login', { tenant: S.tenant, email: appEmail, password: pw });
    const saved = S.token; S.token = (l.session || l).token;
    try { return await fn(); } finally { await api('POST', '/v1/auth/logout').catch(() => {}); S.token = saved; }
  };
  const approveAll = (type) => asApprover(async () => { for (const t of await api('GET', '/v1/wf/inbox')) if (t.entity_type === type) await api('POST', `/v1/wf/tasks/${t.task_id}/approve`, { comment: 'Demo approval' }); });
  step('Adding Saudi customers and suppliers...');
  const existing = await api('GET', '/v1/mdm/parties');
  const mk = async (code, name, isCustomer, countryCode, extra = {}) => {
    let p = existing.find((x) => x.code === code);
    if (!p) p = (await api('POST', '/v1/mdm/parties', { code, name, isCustomer, isSupplier: !isCustomer, countryCode, currencyCode: 'SAR', ownerUnitId: co, ...extra })).party;
    if (p.status === 'draft') await api('POST', `/v1/mdm/parties/${p.id}/submit`);
    return p;
  };
  const riyadh = await mk('SA-C1', 'Riyadh Trading Co', true, 'SA', { taxRegistrationNo: '300000000000003',
    attributes: { street: 'Olaya Street', building_no: '3456', district: 'Al Olaya', city: 'Riyadh', postal_code: '12611', cr_no: '1010123456' } });
  const walkin = await mk('SA-C2', 'Walk-in customer', true, 'SA');
  const importer = await mk('SA-C3', 'Gulf Importer FZE', true, 'AE', { attributes: { street: 'Jebel Ali Free Zone', city: 'Dubai' } });
  const local = await mk('SA-S1', 'Jeddah Office Supplies', false, 'SA');
  const cloud = await mk('SA-S2', 'Cloud Hosting Inc', false, 'US');
  await approveAll('mdm.party');
  step("Owner's capital (approved by the second user)...");
  const d = today();
  const done = await api('GET', `/v1/fin/companies/${co}/invoices`).catch(() => []);
  if (!done.length) {
    await api('POST', `/v1/fin/companies/${co}/journals`, { date: d, memo: "Owner's capital introduced", lines: [{ account: '1010', debit: 200000 }, { account: '3000', credit: 200000 }] });
    await approveAll('fin.journal');
    step('Posting sales and purchases at 15% VAT...');
    const inv = async (b) => { const x = await api('POST', `/v1/fin/companies/${co}/invoices`, { date: d, ...b }); return api('POST', `/v1/fin/invoices/${x.id}/post`); };
    const due = new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 10);
    const s1 = await inv({ kind: 'sales_invoice', partyId: riyadh.id, dueDate: due, lines: [{ description: 'ERP implementation services', quantity: 2, unitPrice: 5000, taxCode: 'SR' }] });
    const s2 = await inv({ kind: 'sales_invoice', partyId: walkin.id, dueDate: d, lines: [{ description: 'Training seat', quantity: 1, unitPrice: 800, taxCode: 'SR' }] });
    const s3 = await inv({ kind: 'sales_invoice', partyId: importer.id, dueDate: due, lines: [{ description: 'Steel brackets (export)', quantity: 1, unitPrice: 12000, taxCode: 'ZR', account: '4200' }] });
    const s4 = await inv({ kind: 'sales_invoice', partyId: riyadh.id, dueDate: due, lines: [{ description: 'Loan arrangement fee', quantity: 1, unitPrice: 3000, taxCode: 'EX', account: '4100' }] });
    await inv({ kind: 'purchase_invoice', partyId: local.id, supplierRef: 'JOS-' + Date.now().toString().slice(-5), lines: [{ description: 'Office furniture', quantity: 1, unitPrice: 4000, taxCode: 'SR', account: '5500' }] });
    await inv({ kind: 'purchase_invoice', partyId: cloud.id, supplierRef: 'CH-' + Date.now().toString().slice(-5), lines: [{ description: 'Cloud hosting (imported service)', quantity: 1, unitPrice: 2500, taxCode: 'RC', account: '5300' }] });
    await api('POST', `/v1/fin/companies/${co}/payments`, { kind: 'receipt', partyId: riyadh.id, date: d, bankAccount: '1010', amount: 5000, allocations: [{ invoiceId: s1.id, amount: 5000 }] });
    step('Issuing ZATCA e-invoices (counter, hash chain, QR code)...');
    for (const x of [s1, s2, s3, s4]) await api('POST', `/v1/fin/invoices/${x.id}/einvoice`);
  }
  step('Employees, contracts and a payroll with GOSI...');
  const emps = await api('GET', '/v1/org/employees');
  const emp = async (no, first, last, nationality) => emps.find((e) => e.employee_no === no) || api('POST', '/v1/org/employees', { employeeNo: no, firstName: first, lastName: last, unitId: co, nationality });
  const e1 = await emp('SA-E1', 'Faisal', 'Al-Harbi', 'SA');
  const e2 = await emp('SA-E2', 'Ravi', 'Menon', 'IN');
  const ks = await api('GET', `/v1/hr/companies/${co}/contracts`);
  if (!ks.find((k) => k.employee_id === e1.id)) await api('POST', '/v1/hr/contracts', { employeeId: e1.id, companyId: co, startDate: '2021-03-01', basic: 15000, housing: 3750, transport: 1000, iban: 'SA4420000001234567891234' });
  if (!ks.find((k) => k.employee_id === e2.id)) await api('POST', '/v1/hr/contracts', { employeeId: e2.id, companyId: co, startDate: '2024-09-01', basic: 9000, housing: 2250, transport: 750 });
  const run = await api('POST', `/v1/hr/companies/${co}/payroll`, { period: d.slice(0, 7) }).catch(() => null);
  if (run && run.status === 'draft') await api('POST', `/v1/hr/payroll/${run.id}/post`);
  S.company = co; cache.companies = null;
  step('Done. Pick BAATS Arabia in the company list on any finance page.');
}

// Demo: everything through the public API, as the signed-in admin plus a second approver user.
async function loadDemo(step) {
  const me = await api('GET', '/v1/me');
  const us = await units(); const root = us.find((u) => u.depth === 0) || us[0];
  let cs = await companies();
  if (!cs.length) {
    step('Setting up books...');
    await api('POST', '/v1/fin/companies', { unitId: root.id, legalName: root.name + ' LLC', taxRegistrationNo: '100000000000003', openFrom: yearStart() });
    cs = await companies();
  }
  const co = S.company;
  step('Adding an approver user...');
  const pw = 'Approver-Demo-2026';
  const users = await api('GET', '/v1/iam/users');
  const appEmail = `approver@${S.tenant}.demo`;
  let approver = users.find((u) => u.email === appEmail);
  if (!approver) {
    approver = await api('POST', '/v1/iam/users', { email: appEmail, displayName: 'Demo Approver', password: pw });
    const roles = await api('GET', '/v1/iam/roles');
    await api('POST', '/v1/iam/assignments', { userId: approver.id, roleId: roles.find((r) => r.code === 'TENANT_ADMIN').id, scopeUnitId: root.id, includeDescendants: true });
  }
  const asApprover = async (fn) => {
    const l = await api('POST', '/v1/auth/login', { tenant: S.tenant, email: appEmail, password: pw });
    const saved = S.token; S.token = (l.session || l).token;
    try { return await fn(); } finally { await api('POST', '/v1/auth/logout').catch(() => {}); S.token = saved; }
  };
  step('Adding a customer and a supplier...');
  const existing = await api('GET', '/v1/mdm/parties');
  const mk = async (code, name, isCustomer, isSupplier, extra = {}) => {
    let p = existing.find((x) => x.code === code);
    if (!p) p = (await api('POST', '/v1/mdm/parties', { code, name, isCustomer, isSupplier, countryCode: 'AE', currencyCode: 'AED', ownerUnitId: co, ...extra })).party;
    if (p.status === 'draft') await api('POST', `/v1/mdm/parties/${p.id}/submit`);
    return p;
  };
  const cust = await mk('DEMO-C1', 'Gulf Retail LLC', true, false, { taxRegistrationNo: '100000000000103' });
  const supp = await mk('DEMO-S1', 'Dubai Office Supplies', false, true);
  step('Approving them as the second user...');
  await asApprover(async () => { for (const t of await api('GET', '/v1/wf/inbox')) if (t.entity_type === 'mdm.party') await api('POST', `/v1/wf/tasks/${t.task_id}/approve`, { comment: 'Demo approval' }); });
  step('Posting invoices and a receipt...');
  const d = today();
  const si = await api('POST', `/v1/fin/companies/${co}/invoices`, { kind: 'sales_invoice', partyId: cust.id, date: d, lines: [
    { description: 'Consulting services', quantity: 10, unitPrice: 1000, taxCode: 'SR' }, { description: 'Export service', quantity: 1, unitPrice: 2500, taxCode: 'ZR', account: '4100' }] });
  const sip = await api('POST', `/v1/fin/invoices/${si.id}/post`);
  const pi = await api('POST', `/v1/fin/companies/${co}/invoices`, { kind: 'purchase_invoice', partyId: supp.id, supplierRef: 'DOS-' + Date.now().toString().slice(-5), date: d, lines: [
    { description: 'Paper and toner', quantity: 4, unitPrice: 500, taxCode: 'SR', account: '5500' }] });
  await api('POST', `/v1/fin/invoices/${pi.id}/post`);
  await api('POST', `/v1/fin/companies/${co}/payments`, { kind: 'receipt', partyId: cust.id, date: d, bankAccount: '1010', amount: 5000, allocations: [{ invoiceId: sip.id || si.id, amount: 5000 }] });
  step("Owner's capital journal (submitted, then approved by the second user)...");
  await api('POST', `/v1/fin/companies/${co}/journals`, { date: d, memo: "Owner's capital introduced", lines: [{ account: '1010', debit: 50000 }, { account: '3000', credit: 50000 }] });
  await asApprover(async () => { for (const t of await api('GET', '/v1/wf/inbox')) if (t.entity_type === 'fin.journal') await api('POST', `/v1/wf/tasks/${t.task_id}/approve`, { comment: 'Demo approval' }); });
  await loadOperationsDemo(step, co, asApprover, root);

  await loadPhase4Demo(step, co, root, asApprover);
