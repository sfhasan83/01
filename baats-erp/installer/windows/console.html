<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAATS ERP Trial Console</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1d2330;--muted:#667085;--line:#e3e6ec;--brand:#1f4fd1;--brand-ink:#fff;--ok:#127a3e;--bad:#b42318;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#1a1f28;--ink:#e7eaf0;--muted:#98a2b3;--line:#2b3240;--brand:#5b84f5;--chip:#232b3d;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-size:16px}header .sp{flex:1}header small{color:var(--muted)}
.wrap{display:flex;min-height:calc(100vh - 53px)}nav{width:210px;padding:12px;border-right:1px solid var(--line);background:var(--panel)}
nav button{display:block;width:100%;text-align:left;margin:2px 0;padding:8px 10px;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer;font:inherit}
nav button.on{background:var(--chip);color:var(--brand);font-weight:600}
main{flex:1;padding:20px;max-width:1200px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.btn{padding:8px 14px;border:0;border-radius:6px;background:var(--brand);color:var(--brand-ink);cursor:pointer;font:inherit;font-weight:600}
.btn.sec{background:var(--chip);color:var(--brand)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tbl{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
th{color:var(--muted);font-weight:600}.muted{color:var(--muted)}.empty{color:var(--muted);padding:8px 0}
#toast{position:fixed;right:16px;bottom:16px;max-width:420px;padding:10px 14px;border-radius:8px;color:#fff;display:none;white-space:pre-wrap}
.auth{max-width:520px;margin:40px auto}.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--chip);font-size:12px;margin:2px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--bg);padding:10px;border-radius:6px;max-height:400px;overflow:auto}
@media (max-width:760px){.wrap{flex-direction:column}nav{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav button{width:auto}main{padding:12px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.tl{color:var(--muted);font-size:12px}.tv{font-size:22px;font-weight:600;margin:2px 0}.ts{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:12px}.chart{min-width:0}.ctitle{font-weight:600;margin-bottom:4px}.cwrap{position:relative}.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:4px}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
:root{--s1:#257de0;--s2:#f47230;--s3:#00b894;--warn:#b54708}@media (prefers-color-scheme:dark){:root{--s1:#338ced;--s2:#e76624;--s3:#00a888;--warn:#fdb022}}
.sw.s1{background:var(--s1)}.sw.s2{background:var(--s2)}.sw.s3{background:var(--s3)}.ln{stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ln.s1{stroke:var(--s1)}.ln.s2{stroke:var(--s2)}.ln.s3{stroke:var(--s3)}
.dot{stroke:var(--panel);stroke-width:2}.dot.s1{fill:var(--s1)}.dot.s2{fill:var(--s2)}.dot.s3{fill:var(--s3)}.grid{stroke:var(--line);stroke-width:1}.grid.zero{stroke:var(--muted)}.axis{fill:var(--muted);font-size:11px}
.hit{fill:transparent;cursor:crosshair}.xhair{stroke:var(--muted);stroke-dasharray:3 3}.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:5;min-width:150px}
.bar{display:grid;grid-template-columns:minmax(90px,35%) 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:13px}.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{height:12px}.bf{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--s1)}.bv{font-variant-numeric:tabular-nums}
.atiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}.atile{display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0}
.atile:hover{border-color:var(--brand)}.atile.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}.atile:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.spark{width:100%;height:30px;margin-top:8px;overflow:visible}.spark polyline{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.spark circle{fill:var(--s1);stroke:var(--panel);stroke-width:2}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.tab{padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit;font-size:13px}.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ana-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.ana-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px}.ana-order{display:flex;flex-direction:column;gap:4px;margin:8px 0}.ana-order div{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 8px}.ana-order span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ana-order button{padding:2px 8px}
.share{color:var(--muted);font-size:12px;margin-left:6px}.rag{font-weight:600;white-space:nowrap}.rag-green{color:var(--ok)}.rag-amber{color:var(--warn)}.rag-red{color:var(--bad)}.checks{display:flex;flex-wrap:wrap;gap:6px 14px}.ck{flex-direction:row!important;align-items:center;gap:6px;display:flex}
.ai-wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}.ai-side{position:sticky;top:12px}.ai-list{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:60vh;overflow:auto}
.ai-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit}.ai-item.on{border-color:var(--brand);background:var(--chip)}.ai-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ai-thread{max-height:62vh;overflow:auto;padding:8px 2px;display:flex;flex-direction:column;gap:10px}.ai-msg{display:flex}.ai-msg.me{justify-content:flex-end}.ai-bubble{max-width:85%;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere}.ai-msg.me .ai-bubble{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ai-bubble p{margin:0 0 8px}.ai-bubble p:last-child{margin-bottom:0}.ai-bubble ul,.ai-bubble ol{margin:4px 0 8px;padding-left:20px}.ai-bubble td.num{text-align:right;font-variant-numeric:tabular-nums}.ai-bubble code{font-size:12px;background:var(--chip);padding:1px 4px;border-radius:4px}
.ai-chip{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin:0 4px 6px 0}.ai-chip.bad{color:var(--bad)}
.ai-change{border:1px solid var(--warn);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--panel)}.ai-change.done{border-color:var(--ok)}.ai-change.rejected,.ai-change.failed{border-color:var(--line)}.ai-err{color:var(--bad);font-size:13px;margin-top:4px}
.ai-ask{display:flex;gap:8px;margin-top:12px;align-items:flex-end}.ai-ask textarea{flex:1;resize:vertical;min-height:44px;font:inherit}.ai-wait{font-style:italic}
@media (max-width:900px){.ai-wrap{grid-template-columns:1fr}.ai-side{position:static}.ai-bubble{max-width:100%}}
</style>
</head>
<body>
<header><b>BAATS Enterprise ERP</b><small id="ver">Trial console</small><span class="sp"></span><span id="who" class="muted"></span><button id="logout" class="btn sec" style="display:none">Sign out</button></header>
<div id="app"></div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = JSON.parse(sessionStorage.getItem('baats') || 'null');
let cache = {};

function toast(msg, ok = true) { const t = $('#toast'); t.textContent = msg; t.style.background = ok ? 'var(--ok)' : 'var(--bad)'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ok ? 2500 : 7000); }
async function api(method, path, body) {
  const h = body === undefined ? {} : { 'content-type': 'application/json' };
  if (S?.token) h.authorization = 'Bearer ' + S.token;
  const r = await fetch(path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await r.text(); let data; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (r.status === 401 && S && path !== '/v1/auth/login') { S = null; sessionStorage.removeItem('baats'); render(); throw new Error('Your session ended. Please sign in again.'); }
  if (!r.ok) throw new Error((data && (data.message || data.error)) || ('HTTP ' + r.status));
  return data;
}
const form = (el) => Object.fromEntries([...el.querySelectorAll('[name]')].map((i) => [i.name, i.type === 'checkbox' ? i.checked : i.value.trim()]).filter(([, v]) => v !== ''));
function table(rows, cols) {
  if (!Array.isArray(rows) || !rows.length) return '<div class="empty">Nothing here yet.</div>';
  cols = cols || Object.keys(rows[0]).filter((k) => !/hash|^id$|_id$|password/.test(k)).slice(0, 10);
  return '<div class="tbl"><table><tr>' + cols.map((c) => `<th>${esc(c.replace(/_/g, ' '))}</th>`).join('') + '</tr>' +
    rows.map((r) => '<tr>' + cols.map((c) => { let v = r[c]; if (v && typeof v === 'object') v = JSON.stringify(v); return `<td title="${esc(v)}">${esc(v)}</td>`; }).join('') + '</tr>').join('') + '</table></div>';
}
const field = (name, label, attrs = '') => `<label>${label}<input name="${name}" ${attrs}></label>`;
const pick = (name, label, opts, attrs = '') => `<label>${label}<select name="${name}" ${attrs}>${opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`;
const check = (name, label, on) => `<label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="${name}" ${on ? 'checked' : ''}>${label}</label>`;
function bindForm(id, fn) { const el = $('#' + id); if (!el) return; el.addEventListener('submit', async (e) => { e.preventDefault(); try { await fn(form(el), el); } catch (err) { toast(err.message, false); } }); }

// ---------- Sign in / create company ----------
function authView() {
  return `<div class="auth">
  <div class="card"><h3>Sign in</h3><form id="f-login"><div class="grid">
    ${field('tenant', 'Company code', 'required value="' + esc(localStorage.getItem('baatsTenant') || '') + '"')}
    ${field('email', 'Email', 'type="email" required')}${field('password', 'Password', 'type="password" required')}
    ${field('totp', 'MFA code (only if enabled)')}</div>
    <div class="row"><button class="btn">Sign in</button></div></form></div>
  <div class="card"><h3>New here? Create your company</h3><p class="muted">This sets up a company with its own head office unit, an administrator account and a default approval workflow.</p>
    <form id="f-company"><div class="grid">
    ${field('code', 'Company code (short, e.g. acme)', 'required pattern="[a-z0-9\\-]+" title="lowercase letters, numbers and dashes"')}
    ${field('name', 'Company name', 'required')}
    ${field('baseCurrency', 'Base currency', 'required value="AED" maxlength="3"')}
    ${field('countryCode', 'Country code', 'required value="AE" maxlength="2"')}
    ${field('adminName', 'Your name', 'required')}
    ${field('adminEmail', 'Your email', 'type="email" required')}
    ${field('adminPassword', 'Password (12+ chars, mixed case, number)', 'type="password" required minlength="12"')}
    </div><div class="row"><button class="btn">Create company</button></div></form></div></div>`;
}
async function afterAuthBind() {
  bindForm('f-login', async (b) => {
    const r = await api('POST', '/v1/auth/login', b);
    const sess = r.session || r; if (!sess.token) throw new Error(r.message || 'Sign in failed');
    S = { token: sess.token, tenant: b.tenant, email: b.email };
    sessionStorage.setItem('baats', JSON.stringify(S)); localStorage.setItem('baatsTenant', b.tenant);
    render();
  });
  bindForm('f-company', async (b) => {
    const r = await fetch('/local/create-company', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
      code: b.code, name: b.name, baseCurrency: b.baseCurrency.toUpperCase(), countryCode: b.countryCode.toUpperCase(),
      admin: { email: b.adminEmail, displayName: b.adminName, password: b.adminPassword } }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(/tenants_code/.test(d.message || '') ? 'That company code is already used. Sign in above, or pick another code.' : (d.message || d.error || 'Could not create the company'));
    toast('Company created. Signing you in...');
    const l = await api('POST', '/v1/auth/login', { tenant: b.code, email: b.adminEmail, password: b.adminPassword });
    const ls = l.session || l; if (!ls.token) throw new Error(l.message || 'Sign in failed');
    S = { token: ls.token, tenant: b.code, email: b.adminEmail };
    sessionStorage.setItem('baats', JSON.stringify(S)); localStorage.setItem('baatsTenant', b.code);
    render();
  });
}

// ---------- Pages ----------
const units = async () => (cache.units = await api('GET', '/v1/org/units'));
const unitOpts = (us) => us.map((u) => [u.id, `${'  '.repeat(u.depth || 0)}${u.code} - ${u.name}`]);
const pages = {
  async overview() {
    const me = await api('GET', '/v1/me');
    return `<div class="card"><h3>Welcome, ${esc(me.user.display_name)}</h3><p class="muted">Signed in to <b>${esc(S.tenant)}</b> as ${esc(me.user.email)}. MFA: ${me.user.mfa_enabled ? 'on' : 'off'}.</p>
      <p>This console lets you try what BAATS can do today. Phase 6a: an interactive dashboard (pick any period and a comparison, click a KPI to see its trend, breakdowns and the records behind it, and keep your own tiles), and country packs with Saudi Arabia beside the UAE: 15% VAT, the ZATCA VAT return, ZATCA e-invoices chained by hash with QR codes, GOSI and the Saudi end-of-service award (try it with Load Saudi demo under Finance: setup). Phase 5: an AI assistant that answers questions from your books and proposes changes for you to confirm (an administrator turns it on under Assistant settings, with Claude or a model on this computer), an executive dashboard computed live from the books, a report builder over governed datasets with CSV export, a strategy scorecard with KPI targets, ESG emissions and resource use, and anomaly checks on the whole ledger. Phase 4: documents with versions and fingerprints, contracts with approval, obligations and renewals, a risk register with controls, tests and a heat map, the compliance calendar, internal audit, one corrective action list with maker-checker verification, the service desk with SLAs, quality inspections and non-conformances carried into the books, health and safety with LTIFR, and facilities booking. Phase 3: projects (timesheets costed onto projects, time and material or milestone billing, budget against actuals), manufacturing (bills of materials with routing, work orders through work in progress at actual cost, multi-level MRP), maintenance (preventive plans by date or distance, work orders, spare parts) and fleet (vehicles, fuel with reclaimable VAT, trips, expiry alerts). Phase 2: finance (books with the BAATS UAE chart of accounts, invoices, receipts and payments, journals with approval, the UAE VAT return, PINT AE e-invoices, bank reconciliation, fixed assets and reports), inventory, purchasing with approval and three-way match, sales and CRM, and HR and payroll with the UAE WPS file and gratuity. Every module posts to the same ledger. Phase 1: organization structure, people, users and roles, master data with approvals, and a tamper-evident audit trail.</p><p><b>Quickest start:</b> open <b>Finance: setup</b> and press <b>Load demo data</b>, then look at Finance: reports and Finance: VAT return.</p></div>
      <div class="card"><h3>Your approvals waiting (${me.inbox.length})</h3>${table(me.inbox)}</div>
      <div class="card"><h3>Your permissions (${me.permissions.length})</h3>${me.permissions.map((p) => `<span class="pill">${esc(typeof p === 'string' ? p : p.permission || JSON.stringify(p))}</span>`).join('')}</div>`;
  },
  async organization() {
    const [us, types] = await Promise.all([units(), api('GET', '/v1/org/unit-types')]);
    return `<div class="card"><h3>Organization units</h3>${table(us, ['code', 'name', 'type', 'depth', 'country_code', 'currency_code', 'is_cost_center', 'is_profit_center', 'status'].filter((c) => !us[0] || c in us[0]))}</div>
    <div class="card"><h3>Add a unit</h3><form id="f-unit"><div class="grid">
      ${pick('typeCode', 'Type', [...types].sort((a, b) => a.rank - b.rank).slice(1).concat([...types].sort((a, b) => a.rank - b.rank).slice(0, 1)).map((t) => [t.code, `${t.name} (level ${t.rank})`]))}${pick('parentId', 'Under', unitOpts(us))}
      ${field('code', 'Code', 'required')}${field('name', 'Name', 'required')}${field('countryCode', 'Country', 'maxlength="2"')}${field('currencyCode', 'Currency', 'maxlength="3"')}
      ${check('isCostCenter', 'Cost center')}${check('isProfitCenter', 'Profit center')}</div><div class="row"><button class="btn">Add unit</button></div></form></div>
    <div class="card"><h3>Hierarchy levels</h3>${table(types)}
      <form id="f-type"><div class="grid">${field('code', 'Code', 'required')}${field('name', 'Name', 'required')}${field('rank', 'Rank (higher = lower in tree)', 'type="number" required')}${check('isLegalEntity', 'Legal entity')}</div><div class="row"><button class="btn sec">Add level</button></div></form></div>
    <div class="card"><h3>Add a designation (job title)</h3><form id="f-desig"><div class="grid">${field('code', 'Code', 'required')}${field('title', 'Title', 'required')}${field('grade', 'Grade')}</div><div class="row"><button class="btn sec">Add designation</button></div></form></div>`;
  },
  async employees() {
    const [us, emps] = await Promise.all([units(), api('GET', '/v1/org/employees')]);
    return `<div class="card"><h3>Employees</h3>${table(emps, ['employee_no', 'first_name', 'last_name', 'email', 'designation', 'nationality', 'status', 'hire_date'].filter((c) => !emps[0] || c in emps[0]))}</div>
    <div class="card"><h3>Add an employee</h3><form id="f-emp"><div class="grid">
      ${field('employeeNo', 'Employee no.', 'required')}${field('firstName', 'First name', 'required')}${field('lastName', 'Last name', 'required')}${field('email', 'Email', 'type="email"')}
      ${pick('unitId', 'Unit', unitOpts(us))}${pick('managerId', 'Manager', [['', '(none)'], ...emps.map((e) => [e.id, `${e.first_name} ${e.last_name}`])])}${field('hireDate', 'Hire date', 'type="date"')}${field('nationality', 'Nationality (2-letter code, e.g. SA, IN)', 'maxlength="2" pattern="[A-Za-z]{2}"')}
      </div><div class="row"><button class="btn">Add employee</button></div></form></div>`;
  },
  async access() {
    const [users, roles, us] = await Promise.all([api('GET', '/v1/iam/users'), api('GET', '/v1/iam/roles'), units()]);
    return `<div class="card"><h3>Users</h3>${table(users)}
      <form id="f-user"><div class="grid">${field('displayName', 'Name', 'required')}${field('email', 'Email', 'type="email" required')}${field('password', 'Password (12+ chars)', 'type="password"')}</div><div class="row"><button class="btn">Add user</button></div></form></div>
    <div class="card"><h3>Roles</h3>${table(roles.map((r) => ({ code: r.code, name: r.name, permissions: (r.permissions || []).filter((p) => p.permission).map((p) => p.permission).join(', ') })))}
      <form id="f-role"><div class="grid">${field('code', 'Code', 'required')}${field('name', 'Name', 'required')}</div><div class="row"><button class="btn sec">Add role</button></div></form>
      <form id="f-perm"><div class="grid">${pick('roleId', 'Role', roles.map((r) => [r.id, r.name]))}${field('perm', 'Permission code (e.g. mdm.item.read)', 'required')}</div><div class="row"><button class="btn sec">Grant permission</button></div></form></div>
    <div class="card"><h3>Give a user a role</h3><form id="f-assign"><div class="grid">
      ${pick('userId', 'User', users.map((u) => [u.id, u.email]))}${pick('roleId', 'Role', roles.map((r) => [r.id, r.name]))}${pick('scopeUnitId', 'For unit', unitOpts(us))}${check('includeDescendants', 'Include units below', true)}
      </div><div class="row"><button class="btn">Assign</button></div></form></div>
    <div class="card"><h3>Why can (or can't) I do something?</h3><form id="f-check"><div class="grid">${field('permission', 'Permission code', 'required value="mdm.party.approve"')}${pick('unitId', 'Unit', [['', '(any)'], ...unitOpts(us)])}</div><div class="row"><button class="btn sec">Check</button></div></form><pre id="check-out" style="display:none"></pre></div>`;
  },
  async masterdata() {
    const [uoms, items, parties, us] = await Promise.all([api('GET', '/v1/mdm/uoms'), api('GET', '/v1/mdm/items'), api('GET', '/v1/mdm/parties'), units()]);

async function show(page) {

  try { m.innerHTML = await pages[page](); } catch (err) { m.innerHTML = `<div class="card"><h3>Could not load this page</h3><p>${esc(err.message)}</p></div>`; return; }
  const reload = () => show(current);
  const ok = (msg) => { toast(msg); reload(); };
  bindForm('f-unit', async (b) => { await api('POST', '/v1/org/units', b); ok('Unit added'); });
  bindForm('f-type', async (b) => { await api('POST', '/v1/org/unit-types', { ...b, rank: Number(b.rank) }); ok('Level added'); });
  bindForm('f-desig', async (b) => { await api('POST', '/v1/org/designations', b); ok('Designation added'); });
  bindForm('f-emp', async (b) => { if (b.nationality) b.nationality = b.nationality.toUpperCase(); await api('POST', '/v1/org/employees', b); ok('Employee added'); });
  bindForm('f-user', async (b) => { await api('POST', '/v1/iam/users', b); ok('User added'); });
  bindForm('f-role', async (b) => { await api('POST', '/v1/iam/roles', b); ok('Role added'); });
  bindForm('f-perm', async (b) => { await api('PUT', `/v1/iam/roles/${b.roleId}/permissions/${encodeURIComponent(b.perm)}`, {}); ok('Permission granted'); });
  bindForm('f-assign', async (b) => { await api('POST', '/v1/iam/assignments', b); ok('Role assigned'); });
  bindForm('f-check', async (b) => { const r = await api('POST', '/v1/iam/check', b); const o = $('#check-out'); o.style.display = 'block'; o.textContent = JSON.stringify(r, null, 2); });
  bindForm('f-party', async (b) => {
    if (b.creditLimit) b.creditLimit = Number(b.creditLimit);
    const attributes = {}; for (const k of ['street', 'city', 'emirate', 'building_no', 'district', 'postal_code', 'cr_no']) if (b[k]) { attributes[k] = k === 'emirate' ? b[k].toUpperCase() : b[k]; delete b[k]; }
    await api('POST', '/v1/mdm/parties', { ...b, attributes }); ok('Saved as draft');
  });
  bindForm('f-item', async (b) => { await api('POST', '/v1/mdm/items', b); ok('Item added'); });
  bindForm('f-uom', async (b) => { await api('POST', '/v1/mdm/uoms', b); ok('Unit of measure added'); });
  bindForm('f-api', async (b) => {
    const out = $('#api-out'); out.textContent = '...';

    catch (err) { out.textContent = 'Error: ' + err.message; }
  });
  m.querySelectorAll('[data-submit]').forEach((el) => el.onclick = async () => { try { await api('POST', `/v1/mdm/parties/${el.dataset.submit}/submit`); ok('Sent for approval'); } catch (e) { toast(e.message, false); } });
  m.querySelectorAll('[data-approve]').forEach((el) => el.onclick = async () => { try { await api('POST', `/v1/wf/tasks/${el.dataset.approve}/approve`, {}); ok('Approved'); } catch (e) { toast(e.message, false); } });
  m.querySelectorAll('[data-reject]').forEach((el) => el.onclick = async () => { const c = prompt('Reason for rejecting?'); if (!c) return; try { await api('POST', `/v1/wf/tasks/${el.dataset.reject}/reject`, { comment: c }); ok('Rejected'); } catch (e) { toast(e.message, false); } });

}

  const from = new Date(Date.UTC(y, q * 3, 1)); const to = new Date(Date.UTC(y, q * 3 + 3, 0)); return [from.toISOString().slice(0, 10), to.toISOString().slice(0, 10)]; };

async function companies() {
  const us = await units();

  for (const u of us.filter((x) => PACK_COUNTRIES.includes(x.country_code) && x.currency_code)) {
    try { const acc = await api('GET', `/v1/fin/companies/${u.id}/accounts`); if (acc.length) out.push({ ...u, accounts: acc }); } catch { /* not a company with books */ }
  }
  cache.companies = out;
  if (!out.find((c) => c.id === S.company)) S.company = out[0]?.id;
  return out;
}

const itemOpts = (items, types) => items.filter((i) => i.status === 'active' && (!types || types.includes(i.item_type))).map((i) => [i.id, `${i.code} - ${i.name}`]);
const d10 = (v) => String(v ?? '').slice(0, 10);
const act = (label, attr, id, sec) => `<button class="btn${sec ? ' sec' : ''}" data-${attr}="${id}">${label}</button>`;
function opLines(n, items, taxOpts, withDiscount) {
  let h = '';
  for (let i = 0; i < n; i++) {
    h += `<div class="grid" style="margin-top:6px">${pick(`i${i}`, `Line ${i + 1}: item`, [['', '(no item / free text)'], ...itemOpts(items)])}${field(`d${i}`, 'Description', i ? '' : 'required')}
      ${field(`q${i}`, 'Quantity', `type="number" step="any" ${i ? '' : 'required value="1"'}`)}${field(`p${i}`, 'Unit price', `type="number" step="any" ${i ? '' : 'required'}`)}
      ${withDiscount ? field(`x${i}`, 'Discount (amount)', 'type="number" step="any" min="0"') : ''}${pick(`t${i}`, 'VAT', taxOpts)}</div>`;
  }
  return h;
}
function readLines(b, n, items) {
  const out = [];
  for (let i = 0; i < n; i++) {
    if (!b[`d${i}`] && !b[`i${i}`]) continue;
    const item = items.find((x) => x.id === b[`i${i}`]);
    out.push({ ...(item ? { itemId: item.id } : {}), description: b[`d${i}`] || item.name, quantity: Number(b[`q${i}`] || 1), unitPrice: Number(b[`p${i}`] || 0),
      taxCode: b[`t${i}`] || 'SR', ...(b[`x${i}`] ? { discount: Number(b[`x${i}`]) } : {}) });
  }
  return out;
}

// Operations demo: warehouse, items, a purchase order through approval, receipt and bill,
// a lead converted and sold, two contracts and a payroll with its WPS file.
async function loadOperationsDemo(step, co, asApprover, root) {
  step('Operations: warehouse and items...');
  const whs = await api('GET', `/v1/inv/companies/${co}/warehouses`);
  const wh = whs.find((w) => w.code === 'MAIN') || await api('POST', `/v1/inv/companies/${co}/warehouses`, { code: 'MAIN', name: 'Main warehouse' });
  const uoms = await api('GET', '/v1/mdm/uoms');
  if (!uoms.find((u) => u.code === 'EA')) await api('POST', '/v1/mdm/uoms', { code: 'EA', name: 'Each' });
  let items = await api('GET', '/v1/mdm/items');
  const item = async (code, name, itemType, attributes) => items.find((i) => i.code === code) || api('POST', '/v1/mdm/items', { code, name, itemType, baseUom: 'EA', attributes });
  const laptop = await item('DEMO-LAP', 'Laptop 14 inch', 'stock', { revenue_account: '4200' });
  await item('DEMO-SETUP', 'Setup service', 'service');
  const parties = await api('GET', '/v1/mdm/parties');
  const supp = parties.find((p) => p.code === 'DEMO-S1'); const cust = parties.find((p) => p.code === 'DEMO-C1');
  step('Operations: purchase order, approval, receipt and bill...');
  const po = await api('POST', `/v1/pur/companies/${co}/orders`, { supplierId: supp.id, warehouseId: wh.id, date: today(), lines: [{ itemId: laptop.id, description: 'Laptop 14 inch', quantity: 10, unitPrice: 2500, taxCode: 'SR' }] });
  await api('POST', `/v1/pur/orders/${po.id}/submit`);
  await asApprover(async () => { for (const t of await api('GET', '/v1/wf/inbox')) if (t.entity_type === 'pur.order') await api('POST', `/v1/wf/tasks/${t.task_id}/approve`, { comment: 'Demo approval' }); });
  await api('POST', `/v1/pur/orders/${po.id}/receipts`, { date: today(), lines: [{ orderLineId: po.lines[0].id, quantity: 10 }] });
  const bill = await api('POST', `/v1/pur/orders/${po.id}/bill`, { date: today(), supplierRef: 'GT-' + Date.now().toString().slice(-6) });
  await api('POST', `/v1/fin/invoices/${bill.id}/post`);
  step('Operations: lead, quotation, order, delivery and invoice...');
  const lead = await api('POST', '/v1/crm/leads', { ownerUnitId: root.id, name: 'Sara Khan', companyName: 'Marina Clinics', email: 'sara@example.com', countryCode: 'AE', source: 'Website' });
  await api('POST', '/v1/crm/opportunities', { ownerUnitId: root.id, leadId: lead.id, title: 'Laptops for 3 clinics', amount: 12000, currency: 'AED', stage: 'proposal' });
  const qt = await api('POST', `/v1/sal/companies/${co}/quotations`, { customerId: cust.id, warehouseId: wh.id, date: today(), lines: [{ itemId: laptop.id, description: 'Laptop 14 inch', quantity: 4, unitPrice: 3200, taxCode: 'SR' }] });
  await api('POST', `/v1/sal/orders/${qt.id}/confirm`);
  await api('POST', `/v1/sal/orders/${qt.id}/deliveries`, { date: today() });
  const si = await api('POST', `/v1/sal/orders/${qt.id}/invoice`, { date: today() });
  await api('POST', `/v1/fin/invoices/${si.id}/post`);
  step('Operations: contracts and payroll...');
  let emps = await api('GET', '/v1/org/employees');
  const emp = async (no, first, last) => emps.find((e) => e.employee_no === no) || api('POST', '/v1/org/employees', { employeeNo: no, firstName: first, lastName: last, unitId: root.id, hireDate: '2021-04-01' });
  const e1 = await emp('DEMO-001', 'Omar', 'Haddad'); const e2 = await emp('DEMO-002', 'Priya', 'Nair');
  const ks = await api('GET', `/v1/hr/companies/${co}/contracts`);
  if (!ks.find((k) => k.employee_id === e1.id)) await api('POST', '/v1/hr/contracts', { employeeId: e1.id, companyId: co, startDate: '2021-04-01', basic: 12000, housing: 5000, transport: 1500, wpsPersonId: '10000000000001', bankRoutingCode: '803320101', iban: 'AE070331234567890123456' });
  if (!ks.find((k) => k.employee_id === e2.id)) await api('POST', '/v1/hr/contracts', { employeeId: e2.id, companyId: co, startDate: today().slice(0, 8) + '01', basic: 8000, housing: 3000, wpsPersonId: '10000000000002', bankRoutingCode: '803320101', iban: 'AE070331234567890123457' });
  const run = await api('POST', `/v1/hr/companies/${co}/payroll`, { period: today().slice(0, 7) }).catch(() => null);
  if (run && run.status === 'draft') await api('POST', `/v1/hr/payroll/${run.id}/post`);
}

function zatcaPage(rows) {

  return `<div class="card"><h3>Seller details for ZATCA e-invoices</h3><p class="muted">ZATCA needs the company's VAT number, commercial registration and national address (street, building number, district, city, postal code). They are checked before every e-invoice is issued.</p>
      <form id="f-seller"><div class="grid">${field('street', 'Street')}${field('buildingNo', 'Building no. (4 digits)', 'pattern="[0-9]{4}"')}${field('district', 'District')}${field('city', 'City')}${field('postalCode', 'Postal code (5 digits)', 'pattern="[0-9]{5}"')}
      ${field('tradeLicenceNo', 'Commercial registration (CR) no.')}${field('taxRegistrationNo', 'VAT number (15 digits, starts and ends with 3)', 'pattern="3[0-9]{13}3"')}${field('iban', 'IBAN (SA...)')}${field('email', 'Email')}${field('phone', 'Phone')}</div>
      <div class="row"><button class="btn sec">Save details</button></div></form></div>
    <div class="card"><h3>Sales documents</h3><p class="muted">Customers with a VAT number or a commercial registration, and exports, get a standard tax invoice (B2B); anyone else a simplified one (B2C). "Issue" writes the UBL XML once with its invoice counter, the previous invoice's hash and a QR code carrying this invoice's hash, so the documents form one unbroken chain.</p>
      <p class="muted"><b>Before going live:</b> ZATCA requires each device to be onboarded and every invoice to be cryptographically stamped with the certificate ZATCA issues, then cleared (B2B) or reported (B2C) through its API. That onboarding is not done in this trial, so these XML files are not yet signed or sent; record ZATCA's answer here once you send them through your onboarded solution.</p>

      ${rows.length ? '<div class="tbl"><table><tr><th>no</th><th>kind</th><th>customer</th><th>date</th><th style="text-align:right">total</th><th>counter</th><th>type</th><th>e-invoice</th><th></th></tr>' + rows.map((r) => `<tr><td>${esc(r.no)}</td><td>${esc(r.kind.replace('_', ' '))}</td><td>${esc(r.party_name)}</td><td>${d10(r.date)}</td><td style="text-align:right">${money(r.gross_total)} ${esc(r.currency)}</td><td>${r.counter ?? ''}</td><td>${typeName(r)}</td><td>${esc(r.status || 'not issued')}${r.asp_reference ? ' · ' + esc(r.asp_reference) : ''}</td><td>${r.einvoice_id ? `${act('Download XML', 'ei-xml', r.einvoice_id, 1)} ${act('QR code data', 'ei-qr', r.einvoice_id, 1)} ${r.status !== 'accepted' ? act('Record ZATCA answer', 'ei-asp', r.einvoice_id, 1) : ''}` : `${act('Check', 'ei-check', r.invoice_id, 1)} ${act('Issue', 'ei-issue', r.invoice_id)}`}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No posted sales documents yet.</div>'}
      <pre id="ei-out" style="display:none"></pre></div>`;
}
/** Read a ZATCA QR code (base64 TLV) back into its fields. */
function readQr(b64) { const b = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); const out = []; for (let i = 0; i < b.length;) { const len = b[i + 1]; out.push(new TextDecoder().decode(b.slice(i + 2, i + 2 + len))); i += 2 + len; } return out; }

  async manufacturing() {

      api('GET', `/v1/mfg/companies/${S.company}/work-orders`), api('GET', '/v1/mdm/items'), api('GET', `/v1/inv/companies/${S.company}/warehouses`)]);

    if (S.mrp) S.mrp = await api('GET', `/v1/mfg/companies/${S.company}/mrp`); // keep it current after every action
    const products = boms.filter((b) => b.status === 'active');
    const woActs = (w) => w.status === 'draft' ? `${act('Release', 'wo-release', w.id)} ${act('Cancel', 'wo-cancel', w.id, 1)}`

      S.mrp.map((r) => `<tr><td>${r.level}</td><td>${esc(r.code)} ${esc(r.name)}</td><td style="text-align:right">${+r.onHand.toFixed(2)}</td><td style="text-align:right">${+(r.salesDemand + r.productionDemand + r.plannedDemand).toFixed(2)}</td><td style="text-align:right">${+(r.incomingPurchases + r.incomingProduction).toFixed(2)}</td><td style="text-align:right">${r.minQty}</td><td style="text-align:right">${r.shortage ? +r.shortage.toFixed(2) : ''}</td><td>${r.action ? `${r.action} ${r.suggestedQty}` : 'covered'}</td><td>${r.action === 'make' ? `<button class="btn sec" data-mrp-make="${r.itemId}" data-qty="${r.suggestedQty}">Create work order</button>` : r.action === 'buy' ? '<span class="muted">raise a purchase order under Purchasing</span>' : ''}</td></tr>`).join('') + '</table></div>' : '';
    return companyBar(cs) + `<div class="card"><h3>Work orders</h3><p class="muted">Release copies the bill of materials onto the order. Materials go to 1350 Work in progress at moving average cost; whatever was not issued by hand is backflushed on completion. Completion also absorbs labour and overhead from the routing (minutes x work center rate, credited to 5060) and puts the product into stock at the order's actual cost.</p>
      ${wos.length ? '<div class="tbl"><table><tr><th>no</th><th>product</th><th style="text-align:right">qty</th><th>status</th><th style="text-align:right">made</th><th style="text-align:right">material</th><th style="text-align:right">labour and overhead</th><th></th></tr>' + wos.map((w) => `<tr><td>${esc(w.no)}</td><td>${esc(w.item_code)} ${esc(w.item_name)}</td><td style="text-align:right">${+w.qty}</td><td>${esc(w.status)}</td><td style="text-align:right">${w.completed_qty === null ? '' : +w.completed_qty}</td><td style="text-align:right">${money(w.material_cost)}</td><td style="text-align:right">${money(w.conversion_cost)}</td><td>${woActs(w)}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No work orders yet.</div>'}
      <pre id="mfg-out" style="display:none"></pre>
      ${products.length && whs.length ? `<form id="f-wo"><div class="grid">${pick('itemId', 'Product', products.map((b) => [b.item_id, `${b.item_code} ${b.item_name}`]))}${field('qty', 'Quantity', 'type="number" step="any" min="0.0001" required value="1"')}${pick('warehouseId', 'Warehouse', whs.map((w) => [w.id, `${w.code} ${w.name}`]))}${field('dueDate', 'Due', 'type="date"')}</div><div class="row"><button class="btn">Create work order</button></div></form>` : '<p class="muted">Add a warehouse (Inventory) and a bill of materials first.</p>'}</div>
    <div class="card"><h3>Material requirements (MRP)</h3><p class="muted">Looks at confirmed sales orders, released work orders and reorder minimums against stock, open purchase orders and open work orders, and works down the bill of materials levels.</p>
      <div class="row"><button class="btn" id="mrp-run">Run MRP</button></div>${mrp}
      <h4>Reorder minimum</h4><form id="f-reorder"><div class="grid">${pick('itemId', 'Item', stock.map((i) => [i.id, `${i.code} ${i.name}`]))}${pick('warehouseId', 'Warehouse', whs.map((w) => [w.id, w.code]))}${field('minQty', 'Minimum', 'type="number" step="any" min="0" required')}${field('reorderQty', 'Order at least', 'type="number" step="any" min="0"')}</div><div class="row"><button class="btn sec">Save</button></div></form></div>
    <div class="card"><h3>Bills of materials</h3>${boms.length ? '<div class="tbl"><table><tr><th>code</th><th>product</th><th style="text-align:right">makes</th><th style="text-align:right">components</th><th>status</th><th></th></tr>' + boms.map((b) => `<tr><td>${esc(b.code)}</td><td>${esc(b.item_code)} ${esc(b.item_name)}</td><td style="text-align:right">${+b.output_qty}</td><td style="text-align:right">${b.components}</td><td>${esc(b.status)}</td><td>${act('Show', 'bom-show', b.id, 1)} ${b.status === 'active' ? act('Standard cost', 'bom-cost', b.item_id, 1) : ''}</td></tr>`).join('') + '</table></div>' : '<div class="empty">None yet.</div>'}
      <h4>New bill of materials</h4><p class="muted">One component per line: <code>ITEM-CODE quantity [scrap %]</code>. One operation per line: <code>sequence WORK-CENTER-CODE setup-minutes run-minutes-per-unit name</code>. A new BOM for a product replaces its active one.</p>

    <div class="card"><h3>Work centers</h3>${report(wcs, [['code', 'Code'], ['name', 'Name'], ['hourly_rate', 'Rate / hour', 1], ['status', 'Status']])}
      <form id="f-wc"><div class="grid">${field('code', 'Code', 'required')}${field('name', 'Name', 'required')}${field('hourlyRate', 'Labour and overhead per hour', 'type="number" step="any" min="0" required')}</div><div class="row"><button class="btn sec">Add work center</button></div></form></div>`;

      <h4>Log a trip</h4><form id="f-trip"><div class="grid">${pick('vehicleId', 'Vehicle', active.map((v) => [v.id, v.plate_no]))}${field('date', 'Date', `type="date" required value="${today()}"`)}${field('endKm', 'Odometer at the end', 'type="number" step="0.1" min="0" required')}${field('purpose', 'Purpose', 'required')}</div><div class="row"><button class="btn sec">Log trip</button></div></form></div>` : ''}

      ${pick('assetId', 'Booked as fixed asset', [['', '(not linked)'], ...fas.filter((a) => a.status === 'active').map((a) => [a.id, `${a.code} ${a.name}`])])}${pick('unitId', 'Cost center', [['', '(from the asset, or none)'], ...unitOpts(us)])}${pick('driverEmployeeId', 'Driver', [['', '(none)'], ...empOpts(emps)])}

Object.assign(after, {
  async projects(m, ok) {
    bindCompanyPick();
    bindForm('f-project', async (b) => { await api('POST', `/v1/prj/companies/${S.company}/projects`, num(b, 'defaultBillRate', 'contractValue', 'budgetCost', 'budgetHours')); ok('Project created'); });
    bindForm('f-member', async (b) => { await api('POST', `/v1/prj/projects/${S.project}/members`, num(b, 'billRate')); ok('Added to the team'); });
    bindForm('f-milestone', async (b) => { await api('POST', `/v1/prj/projects/${S.project}/milestones`, num(b, 'amount')); ok('Milestone added'); });
    bindForm('f-time', async (b) => { await api('POST', '/v1/prj/timesheets', num(b, 'hours')); ok('Time logged'); });
    onAct(m, 'prj-open', async (id) => { S.project = id; show('projects'); });
    onAct(m, 'ms-reached', async (id) => { await api('POST', `/v1/prj/milestones/${id}/reached`, { date: today() }); ok('Milestone reached: it will be on the next invoice'); });
    onAct(m, 'prj-invoice', async (id) => { const i = await api('POST', `/v1/prj/projects/${id}/invoice`, { date: today() }); ok(`Draft invoice for ${money(i.gross_total)} ${i.currency} is under Finance: sales and purchases`); });
    onAct(m, 'prj-close', async (id) => { if (!confirm('Close the project? No more time can be logged.')) return; await api('PATCH', `/v1/prj/projects/${id}`, { status: 'closed' }); ok('Project closed'); });
    const picked = () => [...m.querySelectorAll('[data-ts]')].filter((x) => x.checked).map((x) => x.dataset.ts);
    const ap = $('#ts-approve'); if (ap) ap.onclick = async () => { try { const r = await api('POST', '/v1/prj/timesheets/approve', { ids: picked() }); ok(`Approved ${r.approved}; cost posted to the projects`); } catch (e) { toast(e.message, false); } };
    const rj = $('#ts-reject'); if (rj) rj.onclick = async () => { try { const r = await api('POST', '/v1/prj/timesheets/reject', { ids: picked() }); ok(`Rejected ${r.rejected}`); } catch (e) { toast(e.message, false); } };
  },
  async manufacturing(m, ok) {
    bindCompanyPick();

const fileB64 = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('Could not read the file')); r.readAsDataURL(f); });
const pickedFile = (el) => { const f = el.querySelector('input[type=file]')?.files?.[0]; if (!f) throw new Error('Choose a file'); if (f.size > 10 * 1024 * 1024) throw new Error('Files are limited to 10 MB'); return f; };
async function fileBody(el, b) { const f = pickedFile(el); delete b.file; return { ...b, fileName: f.name, contentType: f.type || 'application/octet-stream', contentBase64: await fileB64(f) }; }
async function downloadDoc(id, version) {
  const r = await fetch(`/v1/dms/documents/${id}/content${version ? `?version=${version}` : ''}`, { headers: { authorization: 'Bearer ' + S.token } });
  if (!r.ok) { let m = 'HTTP ' + r.status; try { m = (await r.json()).message || m; } catch { /* binary */ } throw new Error(m); }
  const name = (/filename="([^"]+)"/.exec(r.headers.get('content-disposition') || '') || [])[1] || 'document';
  const url = URL.createObjectURL(await r.blob()); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const fileField = (label = 'File (up to 10 MB)') => `<label>${label}<input type="file" name="file" required></label>`;
const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const when = (v) => (v ? new Date(v).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '');
const hhmm = (v) => new Date(v).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
const red = (s) => `<span style="color:var(--bad)">${s}</span>`;
const rootUnit = (us) => us.find((u) => u.depth === 0) || us[0];
const actionFields = (emps) => `<div class="grid">${field('actionTitle', 'Corrective action')}${pick('actionOwner', 'Owner', [['', '(choose)'], ...empOpts(emps)])}${field('actionDue', 'Due', `type="date" value="${today()}"`)}</div>`;
const takeActions = (b) => { const a = b.actionTitle ? [{ title: b.actionTitle, ownerEmployeeId: b.actionOwner, dueDate: b.actionDue }] : []; if (a.length && !b.actionOwner) throw new Error('Choose who owns the action'); delete b.actionTitle; delete b.actionOwner; delete b.actionDue; return a; };

  async risk() {
    const [reg, cal, us, emps] = await Promise.all([api('GET', '/v1/grc/risks'), api('GET', `/v1/grc/obligations?asOf=${today()}`), units(), api('GET', '/v1/org/employees')]);
    const risks = reg.risks;
    if (!risks.find((r) => r.id === S.risk)) S.risk = risks[0]?.id;
    const [controls, engs] = await Promise.all([S.risk ? api('GET', `/v1/grc/risks/${S.risk}/controls`) : [], api('GET', '/v1/grc/engagements').catch(() => [])]);
    const r = risks.find((x) => x.id === S.risk);
    const shade = (l, i) => { const s = l * i; return s >= 15 ? '#c0392b' : s >= 8 ? '#e67e22' : s >= 4 ? '#f1c40f' : '#27ae60'; };
    const heat = `<div class="tbl"><table style="width:auto"><tr><th>Likelihood \\ Impact</th>${[1, 2, 3, 4, 5].map((i) => `<th style="text-align:center">${i}</th>`).join('')}</tr>${[5, 4, 3, 2, 1].map((l) => `<tr><th style="text-align:center">${l}</th>${[1, 2, 3, 4, 5].map((i) => `<td style="text-align:center;min-width:44px;background:${shade(l, i)};color:#fff;font-weight:600">${reg.heatMap[l - 1][i - 1] || ''}</td>`).join('')}</tr>`).join('')}</table></div>`;
    return `<div class="card"><h3>Residual risk heat map</h3><p class="muted">Open risks placed by residual likelihood (each control that passed its latest test lowers likelihood by one) and impact.</p>${heat}</div>
    <div class="card"><h3>Risk register</h3>${risks.length ? '<div class="tbl"><table><tr><th>code</th><th>risk</th><th>category</th><th>unit</th><th>owner</th><th>inherent</th><th>controls</th><th>residual</th><th>appetite</th><th>treatment</th><th>status</th><th></th></tr>' + risks.map((x) => `<tr><td>${esc(x.code)}</td><td>${esc(x.title)}</td><td>${esc(x.category)}</td><td>${esc(x.unit_code)}</td><td>${esc(x.owner_name || '')}</td><td>${x.likelihood} x ${x.impact} = ${x.inherent}</td><td>${x.effective_controls} of ${x.controls} effective</td><td>${x.overAppetite ? red(`<b>${x.residual}</b>`) : x.residual}</td><td>${x.appetite}</td><td>${esc(x.treatment)}</td><td>${esc(x.status)}</td><td>${act(x.id === S.risk ? 'Showing' : 'Controls', 'risk-open', x.id, 1)}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No risks yet.</div>'}
      <h4>Add a risk</h4><form id="f-risk"><div class="grid">${pick('unitId', 'Unit', unitOpts(us))}${field('code', 'Code', 'required')}${field('title', 'Risk', 'required')}${pick('category', 'Category', ['operational', 'financial', 'compliance', 'strategic', 'technology', 'hse', 'reputational'].map((c) => [c, c]))}${pick('likelihood', 'Likelihood (1-5)', [1, 2, 3, 4, 5].map((n) => [n, n]))}${pick('impact', 'Impact (1-5)', [1, 2, 3, 4, 5].map((n) => [n, n]))}${pick('ownerEmployeeId', 'Owner', [['', '(none)'], ...empOpts(emps)])}${pick('treatment', 'Treatment', [['mitigate', 'Mitigate'], ['accept', 'Accept'], ['transfer', 'Transfer'], ['avoid', 'Avoid']])}${field('appetite', 'Appetite (max residual score)', 'type="number" min="1" max="25" value="8"')}</div><div class="row"><button class="btn sec">Add risk</button></div></form></div>
    ${r ? `<div class="card"><h3>Controls for ${esc(r.code)} ${esc(r.title)}</h3><p class="muted">A control is tested by someone other than its owner. A failed test raises a corrective action, and when the test is part of an audit, an audit finding too.</p>
      ${controls.length ? '<div class="tbl"><table><tr><th>code</th><th>control</th><th>kind</th><th>frequency</th><th>owner</th><th>last test</th></tr>' + controls.map((c) => `<tr><td>${esc(c.code)}</td><td>${esc(c.title)}</td><td>${esc(c.kind)}</td><td>${esc(c.frequency)}</td><td>${esc(c.owner_name || '')}</td><td>${c.last_test ? `${c.last_test.result === 'effective' ? 'effective' : red('ineffective')} on ${d10(c.last_test.tested_on)}${c.last_test.sample_size ? ` (${c.last_test.exceptions || 0} exceptions in ${c.last_test.sample_size})` : ''}` : 'never tested'}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No controls yet.</div>'}
      <h4>Add a control</h4><form id="f-ctl"><div class="grid">${field('code', 'Code', 'required')}${field('title', 'Control', 'required')}${pick('kind', 'Kind', [['preventive', 'Preventive'], ['detective', 'Detective'], ['corrective', 'Corrective']])}${pick('frequency', 'Frequency', ['daily', 'weekly', 'monthly', 'quarterly', 'annual', 'continuous'].map((c) => [c, c]))}${pick('ownerEmployeeId', 'Owner', [['', '(none)'], ...empOpts(emps)])}</div><div class="row"><button class="btn sec">Add control</button></div></form>
      ${controls.length ? `<h4>Record a test</h4><form id="f-ctest"><div class="grid">${pick('controlId', 'Control', controls.map((c) => [c.id, `${c.code} ${c.title}`]))}${field('testedOn', 'Tested on', `type="date" required value="${today()}"`)}${pick('result', 'Result', [['effective', 'Effective'], ['ineffective', 'Ineffective']])}${field('sampleSize', 'Sample size', 'type="number" min="1"')}${field('exceptions', 'Exceptions found', 'type="number" min="0"')}${pick('engagementId', 'Part of audit', [['', '(none)'], ...engs.filter((e) => e.status !== 'closed').map((e) => [e.id, e.title])])}${field('notes', 'Notes')}</div><div class="row"><button class="btn sec">Record test</button></div></form>` : ''}</div>` : ''}
    <div class="card"><h3>Compliance calendar</h3><p class="muted">Regulatory obligations and their next due dates. Marking one met rolls it to the next period.</p>
      ${cal.length ? '<div class="tbl"><table><tr><th>regulation</th><th>requirement</th><th>frequency</th><th>owner</th><th>next due</th><th>last met</th><th></th></tr>' + cal.map((o) => `<tr><td>${esc(o.regulation)}</td><td>${esc(o.requirement)}</td><td>${esc(o.frequency)}</td><td>${esc(o.owner_name || '')}</td><td>${o.overdue ? red(d10(o.next_due) + ' overdue') : o.dueSoon ? `<b>${d10(o.next_due)}</b>` : d10(o.next_due)}</td><td>${d10(o.last_done)}</td><td>${act('Met', 'co-met', o.id)}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No obligations yet.</div>'}
      <form id="f-comp"><div class="grid">${pick('unitId', 'Unit', unitOpts(us))}${field('regulation', 'Regulation', 'required placeholder="Federal Tax Authority"')}${field('requirement', 'Requirement', 'required placeholder="File the VAT return"')}${pick('frequency', 'Frequency', [['quarterly', 'Quarterly'], ['monthly', 'Monthly'], ['annual', 'Annual'], ['once', 'Once']])}${field('nextDue', 'Next due', `type="date" required value="${today()}"`)}${pick('ownerEmployeeId', 'Owner', [['', '(none)'], ...empOpts(emps)])}</div><div class="row"><button class="btn sec">Add obligation</button></div></form></div>`;
  },

  async audit() {
    const [engs, us, emps] = await Promise.all([api('GET', '/v1/grc/engagements'), units(), api('GET', '/v1/org/employees')]);
    if (!engs.find((e) => e.id === S.engagement)) S.engagement = engs[0]?.id;
    const e = S.engagement ? await api('GET', `/v1/grc/engagements/${S.engagement}`) : null;
    const next = { planned: 'Start fieldwork', fieldwork: 'Move to reporting', reporting: 'Close with opinion' };
    return `<div class="card"><h3>Audit engagements</h3><p class="muted">Planned, fieldwork, reporting, closed. An engagement closes only when every finding has a management response and at least one action.</p>
      ${engs.length ? '<div class="tbl"><table><tr><th>title</th><th>kind</th><th>unit</th><th>period</th><th>findings</th><th>status</th><th>opinion</th><th></th></tr>' + engs.map((x) => `<tr><td>${esc(x.title)}</td><td>${esc(x.kind)}</td><td>${esc(x.unit_code)}</td><td>${d10(x.period_from)} to ${d10(x.period_to)}</td><td>${x.findings} (${x.open_findings} open)</td><td>${esc(x.status)}</td><td>${esc(x.opinion || '')}</td><td>${act(x.id === S.engagement ? 'Showing' : 'Open', 'eng-open', x.id, 1)} ${next[x.status] ? act(next[x.status], 'eng-adv', x.id) : ''}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No engagements yet.</div>'}
      <h4>Plan an engagement</h4><form id="f-eng"><div class="grid">${pick('unitId', 'Unit audited', unitOpts(us))}${field('title', 'Title', 'required')}${pick('kind', 'Kind', [['internal', 'Internal'], ['external', 'External'], ['regulatory', 'Regulatory']])}${field('periodFrom', 'Period from', `type="date" value="${yearStart()}"`)}${field('periodTo', 'Period to', `type="date" value="${today()}"`)}</div><div class="row"><button class="btn sec">Plan</button></div></form></div>
    ${e ? `<div class="card"><h3>${esc(e.title)} <span class="pill">${esc(e.status)}</span></h3>
      <h4>Findings</h4>${e.findings.length ? e.findings.map((f) => `<div style="border-top:1px solid var(--line);padding:8px 0"><b>${esc(f.title)}</b> <span class="pill">${esc(f.severity)}</span> <span class="pill">${esc(f.status)}</span>
        <div><span class="muted">Condition:</span> ${esc(f.condition)}</div><div><span class="muted">Recommendation:</span> ${esc(f.recommendation)}</div>
        ${f.management_response ? `<div><span class="muted">Management response:</span> ${esc(f.management_response)}</div>` : ''}
        ${(f.actions || []).length ? `<ul>${f.actions.map((a) => `<li>${esc(a.title)}: ${esc(a.status)}, due ${d10(a.due_date)}</li>`).join('')}</ul>` : ''}
        ${f.status !== 'closed' && !f.management_response ? `<form class="f-resp" data-finding="${f.id}"><div class="grid">${field('response', 'Management response', 'required')}</div>${actionFields(emps)}<div class="row"><button class="btn sec">Respond</button></div></form>` : ''}</div>`).join('') : '<div class="empty">No findings.</div>'}
      ${e.status === 'fieldwork' || e.status === 'reporting' ? `<h4>Raise a finding</h4><form id="f-find"><div class="grid">${field('title', 'Finding', 'required')}${pick('severity', 'Severity', [['medium', 'Medium'], ['high', 'High'], ['critical', 'Critical'], ['low', 'Low']])}${field('condition', 'What was found', 'required')}${field('recommendation', 'Recommendation', 'required')}</div><div class="row"><button class="btn sec">Raise finding</button></div></form>` : ''}
      ${e.tests.length ? `<h4>Control tests in this audit</h4>${report(e.tests.map((t) => ({ ...t, tested_on: d10(t.tested_on) })), [['control_code', 'Control'], ['tested_on', 'Tested'], ['result', 'Result'], ['exceptions', 'Exceptions'], ['notes', 'Notes']])}` : ''}</div>` : ''}`;
  },

  async actions() {
    const acts = await api('GET', '/v1/grc/actions');
    const btns = (a) => a.status === 'open' ? act('Mark done', 'a-done', a.id) : a.status === 'done' ? `${act('Verify', 'a-ok', a.id)} ${act('Send back', 'a-back', a.id, 1)}` : '';
    return `<div class="card"><h3>Corrective actions (${acts.filter((a) => a.status !== 'verified').length} open)</h3><p class="muted">One list for actions from audit findings, failed control tests, quality non-conformances and safety incidents. The owner marks an action done; someone else holding <span class="pill">grc.action.verify</span> verifies it or sends it back. The finding, NCR or incident it came from can only close once all its actions are verified.</p>
      ${acts.length ? '<div class="tbl"><table><tr><th>action</th><th>from</th><th>owner</th><th>due</th><th>status</th><th>note</th><th></th></tr>' + acts.map((a) => `<tr><td>${esc(a.title)}</td><td>${esc(sourceLabel[a.source_type] || a.source_type)}</td><td>${esc(a.owner_name)}</td><td>${a.overdue ? red(d10(a.due_date)) : d10(a.due_date)}</td><td>${esc(a.status)}</td><td>${esc(a.completion_note || '')}</td><td>${btns(a)}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No actions.</div>'}</div>`;
  },

  async servicedesk() {
    const [ts, sla, spaces, me] = await Promise.all([api('GET', '/v1/svc/tickets'), api('GET', '/v1/svc/sla').catch(() => null), api('GET', '/v1/fac/spaces'), api('GET', '/v1/me')]);
    let assets = []; try { const cs = await companies(); if (cs.length) assets = (await api('GET', `/v1/fin/companies/${S.company}/assets`)).filter((a) => a.status === 'active'); } catch { /* no books */ }
    if (!ts.find((t) => t.id === S.ticket)) S.ticket = ts[0]?.id;
    const t = S.ticket ? await api('GET', `/v1/svc/tickets/${S.ticket}`) : null;
    const pr = { 1: 'P1 critical', 2: 'P2 high', 3: 'P3 normal', 4: 'P4 low' };
    const mine = t && t.requester_user_id === me.user.id;
    return `${sla && sla.length ? `<div class="card"><h3>SLA this month</h3>${report(sla.map((x) => ({ ...x, slaMetPct: x.slaMetPct === null ? '' : x.slaMetPct + '%' })), [['queue', 'Queue'], ['tickets', 'Tickets'], ['resolved', 'Resolved'], ['response_breaches', 'Late first response'], ['resolution_breaches', 'Late resolution'], ['slaMetPct', 'Resolved in time'], ['avg_resolution_hours', 'Avg hours to resolve'], ['satisfaction', 'Satisfaction (1-5)']])}</div>` : ''}
    <div class="card"><h3>Tickets</h3><p class="muted">Anyone can raise a ticket. Agents (<span class="pill">svc.agent</span>) work the queues. Response and resolution targets: P1 1 h / 4 h, P2 4 h / 8 h, P3 8 h / 24 h, P4 24 h / 72 h. The requester confirms the fix, or reopens it.</p>
      ${ts.length ? '<div class="tbl"><table><tr><th>no</th><th>queue</th><th>priority</th><th>title</th><th>requester</th><th>assignee</th><th>status</th><th>SLA</th><th></th></tr>' + ts.map((x) => `<tr><td>${esc(x.no)}</td><td>${esc(x.queue)}</td><td>${pr[x.priority]}</td><td>${esc(x.title)}</td><td>${esc(x.requester)}</td><td>${esc(x.assignee || '')}</td><td>${esc(x.status)}</td><td>${x.resolution_breached ? red('resolution late') : x.response_breached ? red('response late') : `due ${when(x.resolution_due)}`}</td><td>${act(x.id === S.ticket ? 'Showing' : 'Open', 't-open', x.id, 1)}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No tickets.</div>'}</div>
    ${t ? `<div class="card"><h3>${esc(t.no)}: ${esc(t.title)} <span class="pill">${esc(t.status)}</span></h3>
      <p>${esc(t.queue)} · ${esc(t.category)} · ${pr[t.priority]} · raised by ${esc(t.requester)} ${when(t.created_at)}${t.asset_code ? ` · asset ${esc(t.asset_code)}` : ''}${t.maintenance_no ? ` · maintenance ${esc(t.maintenance_no)}` : ''}</p><p>${esc(t.description)}</p>
      ${t.resolution ? `<p><b>Resolution:</b> ${esc(t.resolution)}</p>` : ''}${t.satisfaction ? `<p>Satisfaction ${t.satisfaction}/5</p>` : ''}
      <h4>Conversation</h4>${t.comments.length ? t.comments.map((c) => `<div style="border-top:1px solid var(--line);padding:6px 0"><b>${esc(c.author)}</b> <span class="muted">${when(c.created_at)}${c.internal ? ' · internal note' : ''}</span><div>${esc(c.body)}</div></div>`).join('') : '<div class="empty">No comments yet.</div>'}
      ${t.status !== 'closed' ? `<form id="f-tc"><div class="grid">${field('body', 'Comment', 'required')}${check('internal', 'Internal note (agents only)')}</div><div class="row"><button class="btn sec">Add comment</button></div></form>
      <div class="row">${t.status !== 'resolved' ? `${act('Assign to me', 't-assign', t.id, 1)} ${act('In progress', 't-prog', t.id, 1)} ${act('Waiting on requester', 't-wait', t.id, 1)} ${act('Resolve', 't-resolve', t.id)}` : ''}
        ${t.status === 'resolved' && mine ? `${act('Confirm fixed', 't-ok', t.id)} ${act('Not fixed, reopen', 't-reopen', t.id, 1)}` : ''}
        ${t.asset_id && !t.maintenance_order_id && t.status !== 'resolved' ? act('Raise maintenance work order', 't-mnt', t.id, 1) : ''}</div>` : ''}</div>` : ''}
    <div class="card"><h3>Raise a ticket</h3><form id="f-ticket"><div class="grid">${pick('queue', 'Queue', [['it', 'IT'], ['facilities', 'Facilities'], ['hr', 'HR'], ['finance', 'Finance']])}${field('category', 'Category', 'required placeholder="Laptop"')}${pick('priority', 'Priority', [[3, 'P3 normal'], [2, 'P2 high'], [1, 'P1 critical'], [4, 'P4 low']])}${field('title', 'Title', 'required')}${field('description', 'Description', 'required')}
      ${pick('assetId', 'Asset (optional)', [['', '(none)'], ...assets.map((a) => [a.id, `${a.code} ${a.name}`])])}${pick('spaceId', 'Space (optional)', [['', '(none)'], ...spaces.map((s) => [s.id, `${s.site_code} ${s.code} ${s.name}`])])}</div><div class="row"><button class="btn">Raise ticket</button></div></form></div>`;
  },

  async quality() {
    const cs = await companies(); if (!cs.length) return noBooks;
    const [insp, ncrs, sq, recs, items, whs, wos, emps] = await Promise.all([api('GET', `/v1/qms/companies/${S.company}/inspections`), api('GET', `/v1/qms/companies/${S.company}/ncrs`),
      api('GET', `/v1/qms/companies/${S.company}/supplier-quality`), api('GET', `/v1/qms/companies/${S.company}/receipts`), api('GET', '/v1/mdm/items'),
      api('GET', `/v1/inv/companies/${S.company}/warehouses`), api('GET', `/v1/mfg/companies/${S.company}/work-orders`).catch(() => []), api('GET', '/v1/org/employees')]);
    const open = ncrs.filter((n) => n.status === 'open');
    const sources = [['inv.stock|', 'Stock on hand'], ...recs.filter((r) => r.qty_inspected < r.qty_received).map((r) => [`pur.receipt|${r.receipt_id}|${r.item_id}|${r.warehouse_id || ''}`, `Receipt ${r.receipt_no} ${d10(r.date)} ${r.supplier_name}: ${r.item_code} (${r.qty_received - r.qty_inspected} to inspect)`]),

Object.assign(after, {
  async documents(m, ok) {

    onAct(m, 'doc-hist', async (id) => { const d = await api('GET', `/v1/dms/documents/${id}`); out.style.display = 'block'; out.textContent = `${d.title}\n\n` + d.versions.map((v) => `v${v.version}  ${v.file_name}  ${kb(v.size_bytes)}  ${when(v.uploaded_at)}${v.note ? '  ' + v.note : ''}\n    sha256 ${v.sha256}`).join('\n'); });

      const note = prompt('What changed in this version? (optional)') || undefined;
      await api('POST', `/v1/dms/documents/${vf.dataset.doc}/versions`, { fileName: f.name, contentType: f.type || 'application/octet-stream', contentBase64: await fileB64(f), note }); ok('New version saved'); } catch (e) { toast(e.message, false); } };

  async contracts(m, ok) {

    onAct(m, 'ob-waive', async (id) => { await api('POST', `/v1/lgl/obligations/${id}/done`, { date: today(), waived: true }); ok('Waived'); });

  async audit(m, ok) {

  async servicedesk(m, ok) {

    onAct(m, 't-ok', async (id) => { const s = prompt('How satisfied are you, 1 to 5?', '5'); if (s === null) return; await api('POST', `/v1/svc/tickets/${id}/confirm`, { accepted: true, ...(s ? { satisfaction: Number(s) } : {}) }); ok('Closed'); });

async function loadPhase4Demo(step, co, root, asApprover) {

  const e1 = emps.find((e) => e.employee_no === 'DEMO-001'), e2 = emps.find((e) => e.employee_no === 'DEMO-002');
  const parties = await api('GET', '/v1/mdm/parties'); const supp = parties.find((p) => p.code === 'DEMO-S1');
  const in30 = (n) => { const x = new Date(); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const txt = (s) => btoa(unescape(encodeURIComponent(s)));

  step('Documents and contracts: a policy, and a supply contract through approval...');
  await api('POST', '/v1/dms/documents', { unitId: root.id, title: 'Delegation of authority policy', category: 'policy', fileName: 'delegation-of-authority.txt', contentType: 'text/plain',
    contentBase64: txt('Delegation of authority\n\nPurchases above AED 50,000 need two approvals.\n') });

// ---------- Intelligence (Phase 5) ----------
const fmtKpi = (v, unit) => v === null || v === undefined ? 'n/a' : unit === 'money' ? money(v) : unit === 'pct' ? `${Number(v).toFixed(1)}%` : unit === 'days' ? `${v} days`
  : unit === 'ratio' ? Number(v).toFixed(2) : unit === 'tco2e' ? `${Number(v).toFixed(2)} t` : Number(v).toLocaleString();
const changeTag = (pct, better) => {
  if (pct === null || pct === undefined) return null;
  if (pct === 0) return '<span class="muted">no change</span>';
  const good = better === 'neutral' ? null : (pct > 0) === (better === 'up');
  return `<span style="color:${good === null ? 'var(--muted)' : good ? 'var(--ok)' : 'var(--bad)'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
};
const MODULE_NAMES = { finance: 'Finance', purchasing: 'Purchasing', sales: 'Sales and CRM', inventory: 'Inventory', hr: 'People', projects: 'Projects', manufacturing: 'Manufacturing',
  maintenance: 'Maintenance', fleet: 'Fleet', 'service desk': 'Service desk', governance: 'Governance and risk', quality: 'Quality', safety: 'Health and safety', sustainability: 'Sustainability' };
const ragTag = (s) => s ? `<span class="rag rag-${s}">${{ green: '● On track', amber: '◐ At risk', red: '○ Off track' }[s]}</span>` : '<span class="muted">no data</span>';
const compact = (v) => { const a = Math.abs(v); return a >= 1e6 ? `${(v / 1e6).toFixed(1)}M` : a >= 1e3 ? `${(v / 1e3).toFixed(0)}k` : String(Math.round(v)); };
function niceStep(v) { const p = 10 ** Math.floor(Math.log10(v)); return [1, 2, 2.5, 5, 10].map((m) => m * p).find((x) => x >= v); }
function niceMax(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); return Math.ceil(v / p) * p; }
/** Line chart on one axis: series [{key,label,cls}], points [{month,...}]. Hover columns carry a tooltip. */
function lineChart(points, series, title, fmt = money) {
  const W = 640, H = 220, L = 52, R = 12, T = 12, B = 26, w = W - L - R, h = H - T - B;
  const vals = points.flatMap((p) => series.map((s) => p[s.key]));
  const vmax = Math.max(0, ...vals), vmin = Math.min(0, ...vals), step = niceStep((vmax - vmin) / 4 || 1);
  const hi = Math.ceil(vmax / step) * step || step, lo = Math.floor(vmin / step) * step;
  const x = (i) => L + (points.length === 1 ? w / 2 : (i * w) / (points.length - 1)), y = (v) => T + h - ((v - lo) / (hi - lo)) * h;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  const grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid${v === 0 ? ' zero' : ''}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="axis">${compact(v)}</text>`).join('');
  const xl = points.map((p, i) => (i % 2 === (points.length - 1) % 2 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" class="axis">${p.month.slice(2).replace('-', '/')}</text>` : '')).join('');
  const lines = series.map((s) => `<polyline fill="none" class="ln ${s.cls}" points="${points.map((p, i) => `${x(i)},${y(p[s.key])}`).join(' ')}"/>`
    + `<circle class="dot ${s.cls}" cx="${x(points.length - 1)}" cy="${y(points.at(-1)[s.key])}" r="4"/>`).join('');
  const hits = points.map((p, i) => `<rect class="hit" x="${x(i) - w / points.length / 2}" y="${T}" width="${w / points.length}" height="${h}" data-tip="${esc(`<b>${p.month}</b>` + series.map((s) => `<div><i class="sw ${s.cls}"></i>${s.label}: ${fmt(p[s.key])}</div>`).join(''))}" data-x="${x(i)}"/>`).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i class="sw ${s.cls}"></i>${s.label}</span>`).join('')}</div>` : '';
  return `<div class="chart"><div class="ctitle">${title}</div>${legend}<div class="cwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}${xl}${lines}<line class="xhair" y1="${T}" y2="${T + h}" x1="0" x2="0" style="display:none"/>${hits}</svg><div class="tip" style="display:none"></div></div></div>`;
}
function bindCharts(m) {
  m.querySelectorAll('.cwrap').forEach((c) => {
    const tip = c.querySelector('.tip'), xh = c.querySelector('.xhair');
    c.querySelectorAll('[data-tip]').forEach((r) => {
      r.addEventListener('mouseenter', () => { tip.innerHTML = r.dataset.tip; tip.style.display = 'block'; if (xh && r.dataset.x) { xh.setAttribute('x1', r.dataset.x); xh.setAttribute('x2', r.dataset.x); xh.style.display = ''; } });
      r.addEventListener('mousemove', (e) => { const b = c.getBoundingClientRect(); tip.style.left = Math.min(e.clientX - b.left + 12, b.width - 190) + 'px'; tip.style.top = (e.clientY - b.top + 12) + 'px'; });
      r.addEventListener('mouseleave', () => { tip.style.display = 'none'; if (xh) xh.style.display = 'none'; });
    });
  });
}
/** Horizontal bars for a ranked list (one series, so one colour). */
function barList(rows, label, value, title, fmt = money) {
  if (!rows.length) return `<div class="chart"><div class="ctitle">${title}</div><div class="empty">Nothing yet.</div></div>`;
  const max = Math.max(...rows.map((r) => Math.abs(r[value]))) || 1;
  return `<div class="chart"><div class="ctitle">${title}</div><div class="cwrap">${rows.map((r) => `<div class="bar" data-tip="${esc(`<b>${esc(r[label])}</b><div>${fmt(r[value])}</div>`)}"><span class="bl">${esc(r[label])}</span><span class="bt"><span class="bf" style="width:${Math.max(1, Math.abs(r[value]) / max * 100)}%"></span></span><span class="bv">${fmt(r[value])}</span></div>`).join('')}<div class="tip" style="display:none"></div></div></div>`;
}

// ---------- AI assistant (Phase 5b) ----------
// Assistant answers are model text: escape everything, then allow a small, safe subset of Markdown.
function mdLite(src) {
  const inline = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = String(src ?? '').replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i].trim().slice(1, -1).split('|').map((c) => c.trim())); i++; }
      const body = rows.filter((r) => !r.every((c) => /^:?-{2,}:?$/.test(c)));
      const num = (c) => /^[-+]?[\d,]+(\.\d+)?%?$/.test(c.replace(/[A-Z]{3}\s?/, ''));
      out += '<div class="tbl"><table>' + body.map((r, n) => '<tr>' + r.map((c) => n === 0 ? `<th>${inline(c)}</th>` : `<td${num(c) ? ' class="num"' : ''}>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table></div>';
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, '')); i++; }
      out += `<${ordered ? 'ol' : 'ul'}>${items.map((x) => `<li>${inline(x)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`;
      continue;
    }
    const h = l.match(/^#{1,4}\s+(.*)$/);
    if (h) { out += `<p><b>${inline(h[1])}</b></p>`; i++; continue; }
    if (!l.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^\s*(\||[-*]\s|\d+\.\s|#)/.test(lines[i])) { para.push(inline(lines[i])); i++; }
    if (para.length) out += `<p>${para.join('<br>')}</p>`; else { out += `<p>${inline(l)}</p>`; i++; }
  }
  return out;
}
const TOOL_LABELS = { list_kpis: 'Listed the KPIs', get_kpi: 'Looked up a KPI', kpi_trend: 'Looked up a KPI trend', kpi_breakdown: 'Broke down a KPI', executive_dashboard: 'Read the dashboard', trial_balance: 'Read the trial balance',
  profit_and_loss: 'Read the profit and loss', balance_sheet: 'Read the balance sheet', ageing: 'Read the ageing', find_partners: 'Searched customers and suppliers', stock_levels: 'Read stock levels',
  list_datasets: 'Listed report datasets', run_report: 'Ran a report', anomaly_checks: 'Ran the anomaly checks', esg_report: 'Read the ESG report', strategy_scorecard: 'Read the scorecard', my_tickets: 'Listed tickets' };
function aiCall(c) {
  if (c.kind === 'read') {
    const label = TOOL_LABELS[c.tool] || c.summary;
    return `<span class="ai-chip ${c.status === 'failed' ? 'bad' : ''}" title="${esc(c.summary)}${c.error ? ' · ' + esc(c.error) : ''}">${c.status === 'failed' ? '✕' : '✓'} ${esc(label)}${c.status === 'failed' ? ' (not possible)' : ''}</span>`;
  }
  const state = { pending: 'Waiting for you', done: 'Done', rejected: 'You rejected this', failed: 'Could not be done' }[c.status];
  return `<div class="ai-change ${c.status}"><div><b>Proposed change</b> · <span class="muted">${esc(state)}</span></div><div>${esc(c.summary)}</div>
    ${c.status === 'pending' ? `<div class="row"><button class="btn" data-ai-ok="${c.id}">Confirm</button><button class="btn sec" data-ai-no="${c.id}">Reject</button></div>` : ''}
    ${c.error ? `<div class="ai-err">${esc(c.error)}</div>` : ''}${c.status === 'done' && c.result?.no ? `<div class="muted">Reference ${esc(c.result.no)}</div>` : ''}</div>`;
}
function aiThread(conv) {
  if (!conv.messages.length) return `<div class="empty">Ask about sales, cash, overdue customers, stock, emissions or anything else in your books. For example: <i>How did revenue this quarter compare with last quarter?</i> or <i>Which customers are more than 60 days overdue?</i></div>`;
  // One bubble per answer: consecutive assistant steps (look-ups, then the reply) are shown together.
  const groups = [];
  for (const m of conv.messages) { const g = groups[groups.length - 1]; if (m.role === 'assistant' && g?.role === 'assistant') g.parts.push(m); else groups.push({ role: m.role, parts: [m] }); }
  const part = (m) => `${m.toolCalls.filter((c) => c.kind === 'read').map(aiCall).join('')}${m.text ? mdLite(m.text) : ''}${m.notice ? `<p class="muted">${esc(m.notice)}</p>` : ''}${m.toolCalls.filter((c) => c.kind === 'change').map(aiCall).join('')}`;
  return groups.map((g) => g.role === 'user'
    ? `<div class="ai-msg me"><div class="ai-bubble">${esc(g.parts[0].text).replace(/\n/g, '<br>')}</div></div>`
    : `<div class="ai-msg"><div class="ai-bubble">${g.parts.map(part).join('')}</div></div>`).join('');
}

const PERIODS = [['this_month', 'This month'], ['last_month', 'Last month'], ['this_quarter', 'This quarter'], ['last_quarter', 'Last quarter'], ['this_year', 'This financial year'],
  ['last_year', 'Last financial year'], ['last_12_months', 'Last 12 months'], ['custom', 'Custom dates']];
const COMPARES = [['previous_period', 'Previous period'], ['previous_year', 'Same period last year'], ['none', 'No comparison']];
const optsHtml = (opts, v) => opts.map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(t)}</option>`).join('');
const anaQuery = (extra = {}) => { const a = S.ana; const q = new URLSearchParams({ period: a.period, compare: a.compare, ...extra }); if (a.period === 'custom') { q.set('from', a.from); q.set('to', a.to); } return q; };
/** A small trend line for a tile: one series, no axes; the last point marked. */
function spark(points) {
  const v = points.map((p) => p.value ?? 0); if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), W = 120, H = 30, x = (i) => (i * W) / (v.length - 1), y = (n) => H - 3 - ((n - lo) / ((hi - lo) || 1)) * (H - 6);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${v.map((n, i) => `${x(i)},${y(n)}`).join(' ')}" vector-effect="non-scaling-stroke"/></svg>`;
}
function breakdownBars(b) {
  if (!b.rows.length) return '<div class="empty">Nothing in this period.</div>';
  const f = (v) => fmtKpi(v, b.unit === 'count' ? 'count' : b.unit === 'tco2e' ? 'tco2e' : 'money');
  const max = Math.max(...b.rows.map((r) => Math.abs(r.value))) || 1;
  return `<div class="cwrap">${b.rows.map((r) => `<div class="bar" data-tip="${esc(`<b>${esc(r.label)}</b><div>${f(r.value)}${r.share !== null ? ` · ${r.share}% of the total` : ''}</div>`)}"><span class="bl" title="${esc(r.label)}">${esc(r.label)}</span><span class="bt"><span class="bf" style="width:${Math.max(1, Math.abs(r.value) / max * 100)}%"></span></span><span class="bv">${f(r.value)}${r.share !== null ? `<span class="share">${r.share}%</span>` : ''}</span></div>`).join('')}<div class="tip" style="display:none"></div></div>`;
}

    on('ana-close', 'onclick', () => { A.drill = null; show('analytics'); });
