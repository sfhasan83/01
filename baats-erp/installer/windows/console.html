<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAATS ERP Trial Console</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#1d2330;--muted:#667085;--line:#e3e6ec;--brand:#1f4fd1;--brand-ink:#fff;--ok:#127a3e;--bad:#b42318;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--panel:#1a1f28;--ink:#e7eaf0;--muted:#98a2b3;--line:#2b3240;--brand:#5b84f5;--chip:#232b3d;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{font-size:16px}header .sp{flex:1}header small{color:var(--muted)}
.wrap{display:flex;min-height:calc(100vh - 53px)}nav{width:210px;padding:12px;border-right:1px solid var(--line);background:var(--panel)}
nav button{display:block;width:100%;text-align:left;margin:2px 0;padding:8px 10px;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer;font:inherit}
nav button.on{background:var(--chip);color:var(--brand);font-weight:600}
main{flex:1;padding:20px;max-width:1200px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.btn{padding:8px 14px;border:0;border-radius:6px;background:var(--brand);color:var(--brand-ink);cursor:pointer;font:inherit;font-weight:600}
.btn.sec{background:var(--chip);color:var(--brand)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tbl{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
th{color:var(--muted);font-weight:600}.muted{color:var(--muted)}.empty{color:var(--muted);padding:8px 0}
#toast{position:fixed;right:16px;bottom:16px;max-width:420px;padding:10px 14px;border-radius:8px;color:#fff;display:none;white-space:pre-wrap}
.auth{max-width:520px;margin:40px auto}.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--chip);font-size:12px;margin:2px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--bg);padding:10px;border-radius:6px;max-height:400px;overflow:auto}
@media (max-width:760px){.wrap{flex-direction:column}nav{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav button{width:auto}main{padding:12px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.tl{color:var(--muted);font-size:12px}.tv{font-size:22px;font-weight:600;margin:2px 0}.ts{font-size:12px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:12px}.chart{min-width:0}.ctitle{font-weight:600;margin-bottom:4px}.cwrap{position:relative}.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:4px}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
:root{--s1:#257de0;--s2:#f47230;--s3:#00b894;--warn:#b54708}@media (prefers-color-scheme:dark){:root{--s1:#338ced;--s2:#e76624;--s3:#00a888;--warn:#fdb022}}
.sw.s1{background:var(--s1)}.sw.s2{background:var(--s2)}.sw.s3{background:var(--s3)}.ln{stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ln.s1{stroke:var(--s1)}.ln.s2{stroke:var(--s2)}.ln.s3{stroke:var(--s3)}
.dot{stroke:var(--panel);stroke-width:2}.dot.s1{fill:var(--s1)}.dot.s2{fill:var(--s2)}.dot.s3{fill:var(--s3)}.grid{stroke:var(--line);stroke-width:1}.grid.zero{stroke:var(--muted)}.axis{fill:var(--muted);font-size:11px}
.hit{fill:transparent;cursor:crosshair}.xhair{stroke:var(--muted);stroke-dasharray:3 3}.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:5;min-width:150px}
.bar{display:grid;grid-template-columns:minmax(90px,35%) 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:13px}.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bt{height:12px}.bf{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--s1)}.bv{font-variant-numeric:tabular-nums}
.atiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}.atile{display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0}
.atile:hover{border-color:var(--brand)}.atile.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}.atile:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.spark{width:100%;height:30px;margin-top:8px;overflow:visible}.spark polyline{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.spark circle{fill:var(--s1);stroke:var(--panel);stroke-width:2}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.tab{padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink);cursor:pointer;font:inherit;font-size:13px}.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ana-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.ana-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px}.ana-order{display:flex;flex-direction:column;gap:4px;margin:8px 0}.ana-order div{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 8px}.ana-order span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ana-order button{padding:2px 8px}
.share{color:var(--muted);font-size:12px;margin-left:6px}.rag{font-weight:600;white-space:nowrap}.rag-green{color:var(--ok)}.rag-amber{color:var(--warn)}.rag-red{color:var(--bad)}.checks{display:flex;flex-wrap:wrap;gap:6px 14px}.ck{flex-direction:row!important;align-items:center;gap:6px;display:flex}
.ai-wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}.ai-side{position:sticky;top:12px}.ai-list{display:flex;flex-direction:column;gap:4px;margin-top:10px;max-height:60vh;overflow:auto}
.ai-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit}.ai-item.on{border-color:var(--brand);background:var(--chip)}.ai-item span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ai-thread{max-height:62vh;overflow:auto;padding:8px 2px;display:flex;flex-direction:column;gap:10px}.ai-msg{display:flex}.ai-msg.me{justify-content:flex-end}.ai-bubble{max-width:85%;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere}.ai-msg.me .ai-bubble{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ai-bubble p{margin:0 0 8px}.ai-bubble p:last-child{margin-bottom:0}.ai-bubble ul,.ai-bubble ol{margin:4px 0 8px;padding-left:20px}.ai-bubble td.num{text-align:right;font-variant-numeric:tabular-nums}.ai-bubble code{font-size:12px;background:var(--chip);padding:1px 4px;border-radius:4px}
.ai-chip{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin:0 4px 6px 0}.ai-chip.bad{color:var(--bad)}
.ai-change{border:1px solid var(--warn);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--panel)}.ai-change.done{border-color:var(--ok)}.ai-change.rejected,.ai-change.failed{border-color:var(--line)}.ai-err{color:var(--bad);font-size:13px;margin-top:4px}
.ai-ask{display:flex;gap:8px;margin-top:12px;align-items:flex-end}.ai-ask textarea{flex:1;resize:vertical;min-height:44px;font:inherit}.ai-wait{font-style:italic}
@media (max-width:900px){.ai-wrap{grid-template-columns:1fr}.ai-side{position:static}.ai-bubble{max-width:100%}}
</style>
</head>
<body>
<header><b>BAATS Enterprise ERP</b><small id="ver">Trial console</small><span class="sp"></span><span id="who" class="muted"></span><button id="logout" class="btn sec" style="display:none">Sign out</button></header>
<div id="app"></div>
<div id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = JSON.parse(sessionStorage.getItem('baats') || 'null');
let cache = {};

function toast(msg, ok = true) { const t = $('#toast'); t.textContent = msg; t.style.background = ok ? 'var(--ok)' : 'var(--bad)'; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ok ? 2500 : 7000); }
async function api(method, path, body) {
  const h = body === undefined ? {} : { 'content-type': 'application/json' };
  if (S?.token) h.authorization = 'Bearer ' + S.token;
  const r = await fetch(path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await r.text(); let data; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (r.status === 401 && S && path !== '/v1/auth/login') { S = null; sessionStorage.removeItem('baats'); render(); throw new Error('Your session ended. Please sign in again.'); }
  if (!r.ok) throw new Error((data && (data.message || data.error)) || ('HTTP ' + r.status));
  return data;
}
const form = (el) => Object.fromEntries([...el.querySelectorAll('[name]')].map((i) => [i.name, i.type === 'checkbox' ? i.checked : i.value.trim()]).filter(([, v]) => v !== ''));
function table(rows, cols) {
  if (!Array.isArray(rows) || !rows.length) return '<div class="empty">Nothing here yet.</div>';
  cols = cols || Object.keys(rows[0]).filter((k) => !/hash|^id$|_id$|password/.test(k)).slice(0, 10);
  return '<div class="tbl"><table><tr>' + cols.map((c) => `<th>${esc(c.replace(/_/g, ' '))}</th>`).join('') + '</tr>' +
    rows.map((r) => '<tr>' + cols.map((c) => { let v = r[c]; if (v && typeof v === 'object') v = JSON.stringify(v); return `<td title="${esc(v)}">${esc(v)}</td>`; }).join('') + '</tr>').join('') + '</table></div>';
}
const field = (name, label, attrs = '') => `<label>${label}<input name="${name}" ${attrs}></label>`;
const pick = (name, label, opts, attrs = '') => `<label>${label}<select name="${name}" ${attrs}>${opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></label>`;
const check = (name, label, on) => `<label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" name="${name}" ${on ? 'checked' : ''}>${label}</label>`;
function bindForm(id, fn) { const el = $('#' + id); if (!el) return; el.addEventListener('submit', async (e) => { e.preventDefault(); try { await fn(form(el), el); } catch (err) { toast(err.message, false); } }); }

// ---------- Sign in / create company ----------
function authView() {
  return `<div class="auth">
  <div class="card"><h3>Sign in</h3><form id="f-login"><div class="grid">
    ${field('tenant', 'Company code', 'required value="' + esc(localStorage.getItem('baatsTenant') || '') + '"')}
    ${field('email', 'Email', 'type="email" required')}${field('password', 'Password', 'type="password" required')}
    ${field('totp', 'MFA code (only if enabled)')}</div>
    <div class="row"><button class="btn">Sign in</button></div></form>
    ${SSO_ERROR ? `<p style="color:var(--bad)">Sign-in with your work account did not work: ${esc(SSO_ERROR)}</p>` : ''}<div id="sso-box"></div></div>
  <div class="card"><h3>New here? Create your company</h3><p class="muted">This sets up a company with its own head office unit, an administrator account and a default approval workflow.</p>
    <form id="f-company"><div class="grid">
    ${field('code', 'Company code (short, e.g. acme)', 'required pattern="[a-z0-9\\-]+" title="lowercase letters, numbers and dashes"')}
    ${field('name', 'Company name', 'required')}
    ${field('baseCurrency', 'Base currency', 'required value="AED" maxlength="3"')}
    ${field('countryCode', 'Country code', 'required value="AE" maxlength="2"')}
    ${field('adminName', 'Your name', 'required')}
    ${field('adminEmail', 'Your email', 'type="email" required')}
    ${field('adminPassword', 'Password (12+ chars, mixed case, number)', 'type="password" required minlength="12"')}
    </div><div class="row"><button class="btn">Create company</button></div></form></div></div>`;
}
async function afterAuthBind() {
  const tIn = $('#f-login [name=tenant]'); let tT;
  tIn.addEventListener('input', () => { clearTimeout(tT); tT = setTimeout(() => showSsoButtons(tIn.value.trim()), 400); });
  showSsoButtons(tIn.value.trim());
  bindForm('f-login', async (b) => {
    const r = await api('POST', '/v1/auth/login', b);
    const sess = r.session || r; if (!sess.token) throw new Error(r.message || 'Sign in failed');
    S = { token: sess.token, tenant: b.tenant, email: b.email };
    sessionStorage.setItem('baats', JSON.stringify(S)); localStorage.setItem('baatsTenant', b.tenant);
    render();
  });
  bindForm('f-company', async (b) => {
    const r = await fetch('/local/create-company', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
      code: b.code, name: b.name, baseCurrency: b.baseCurrency.toUpperCase(), countryCode: b.countryCode.toUpperCase(),
      admin: { email: b.adminEmail, displayName: b.adminName, password: b.adminPassword } }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(/tenants_code/.test(d.message || '') ? 'That company code is already used. Sign in above, or pick another code.' : (d.message || d.error || 'Could not create the company'));
    toast('Company created. Signing you in...');
    const l = await api('POST', '/v1/auth/login', { tenant: b.code, email: b.adminEmail, password: b.adminPassword });
    const ls = l.session || l; if (!ls.token) throw new Error(l.message || 'Sign in failed');
    S = { token: ls.token, tenant: b.code, email: b.adminEmail };
    sessionStorage.setItem('baats', JSON.stringify(S)); localStorage.setItem('baatsTenant', b.code);
    render();
  });
}

// ---------- Pages ----------
const units = async () => (cache.units = await api('GET', '/v1/org/units'));
const unitOpts = (us) => us.map((u) => [u.id, `${'  '.repeat(u.depth || 0)}${u.code} - ${u.name}`]);
const pages = {
  async overview() {
    const me = await api('GET', '/v1/me');
    return `<div class="card"><h3>Welcome, ${esc(me.user.display_name)}</h3><p class="muted">Signed in to <b>${esc(S.tenant)}</b> as ${esc(me.user.email)}. MFA: ${me.user.mfa_enabled ? 'on' : 'off'}.</p>
      <p>This console lets you try what BAATS can do today. Phase 7a, getting ready to go live: Data import brings customers, suppliers, items with their stock, employees with contracts, open invoices and bills and the opening trial balance in from Excel (CSV) or a BAATS Accounting book, each file checked before anything is saved; Backup and restore makes a backup of everything every day and lets you restore one (the data before it is backed up too); My sessions and password shows where you are signed in, changes your password and sets up an authenticator app; sign-ins and the API are limited against password guessing. Phase 6c: BAATS Mobile, a phone app for approvals, leave, payslips and expense claims with a receipt photo (see BAATS Mobile; switch on phone access there to use it on a phone on the same Wi-Fi), expense claims approved by the line manager and posted with their input VAT, and integrations: API keys for other systems and signed webhooks when invoices, payments, payroll, claims, leave and tickets happen. Phase 6b: the rest of the GCC beside the UAE and Saudi Arabia: Oman (5% VAT and its return, 15% income tax, the Social Protection Fund), Bahrain (10% VAT and the NBR return, SIO with the leaving indemnity), Qatar and Kuwait (no VAT; GRSIA and PIFSS), each with its own end-of-service rule, and money in three decimals for the dinar and rial (try it with Load GCC demo under Finance: setup). Phase 6a: an interactive dashboard (pick any period and a comparison, click a KPI to see its trend, breakdowns and the records behind it, and keep your own tiles), and country packs with Saudi Arabia beside the UAE: 15% VAT, the ZATCA VAT return, ZATCA e-invoices chained by hash with QR codes, GOSI and the Saudi end-of-service award (try it with Load Saudi demo under Finance: setup). Phase 5: an AI assistant that answers questions from your books and proposes changes for you to confirm (an administrator turns it on under Assistant settings, with Claude or a model on this computer), an executive dashboard computed live from the books, a report builder over governed datasets with CSV export, a strategy scorecard with KPI targets, ESG emissions and resource use, and anomaly checks on the whole ledger. Phase 4: documents with versions and fingerprints, contracts with approval, obligations and renewals, a risk register with controls, tests and a heat map, the compliance calendar, internal audit, one corrective action list with maker-checker verification, the service desk with SLAs, quality inspections and non-conformances carried into the books, health and safety with LTIFR, and facilities booking. Phase 3: projects (timesheets costed onto projects, time and material or milestone billing, budget against actuals), manufacturing (bills of materials with routing, work orders through work in progress at actual cost, multi-level MRP), maintenance (preventive plans by date or distance, work orders, spare parts) and fleet (vehicles, fuel with reclaimable VAT, trips, expiry alerts). Phase 2: finance (books with the BAATS UAE chart of accounts, invoices, receipts and payments, journals with approval, the UAE VAT return, PINT AE e-invoices, bank reconciliation, fixed assets and reports), inventory, purchasing with approval and three-way match, sales and CRM, and HR and payroll with the UAE WPS file and gratuity. Every module posts to the same ledger. Phase 1: organization structure, people, users and roles, master data with approvals, and a tamper-evident audit trail.</p><p><b>Quickest start:</b> open <b>Finance: setup</b> and press <b>Load demo data</b>, then look at Finance: reports and Finance: VAT return.</p></div>
      <div class="card"><h3>Your approvals waiting (${me.inbox.length})</h3>${table(me.inbox)}</div>
      <div class="card"><h3>Your permissions (${me.permissions.length})</h3>${me.permissions.map((p) => `<span class="pill">${esc(typeof p === 'string' ? p : p.permission || JSON.stringify(p))}</span>`).join('')}</div>`;
  },
  async organization() {
    const [us, types] = await Promise.all([units(), api('GET', '/v1/org/unit-types')]);
    return `<div class="card"><h3>Organization units</h3>${table(us, ['code', 'name', 'type', 'depth', 'country_code', 'currency_code', 'is_cost_center', 'is_profit_center', 'status'].filter((c) => !us[0] || c in us[0]))}</div>
    <div class="card"><h3>Add a unit</h3><form id="f-unit"><div class="grid">
      ${pick('typeCode', 'Type', [...types].sort((a, b) => a.rank - b.rank).slice(1).concat([...types].sort((a, b) => a.rank - b.rank).slice(0, 1)).map((t) => [t.code, `${t.name} (level ${t.rank})`]))}${pick('parentId', 'Under', unitOpts(us))}
      ${field('code', 'Code', 'required')}${field('name', 'Name', 'required')}${field('countryCode', 'Country', 'maxlength="2"')}${field('currencyCode', 'Currency', 'maxlength="3"')}
      ${check('isCostCenter', 'Cost center')}${check('isProfitCenter', 'Profit center')}</div><div class="row"><button class="btn">Add unit</button></div></form></div>
    <div class="card"><h3>Hierarchy levels</h3>${table(types)}
      <form id="f-type"><div class="grid">${field('code', 'Code', 'required')}${field('name', 'Name', 'required')}${field('rank', 'Rank (higher = lower in tree)', 'type="number" required')}${check('isLegalEntity', 'Legal entity')}</div><div class="row"><button class="btn sec">Add level</button></div></form></div>
    <div class="card"><h3>Add a designation (job title)</h3><form id="f-desig"><div class="grid">${field('code', 'Code', 'required')}${field('title', 'Title', 'required')}${field('grade', 'Grade')}</div><div class="row"><button class="btn sec">Add designation</button></div></form></div>`;
  },
  async employees() {
    const [us, emps] = await Promise.all([units(), api('GET', '/v1/org/employees')]);
    return `<div class="card"><h3>Employees</h3>${table(emps, ['employee_no', 'first_name', 'last_name', 'email', 'designation', 'nationality', 'status', 'hire_date'].filter((c) => !emps[0] || c in emps[0]))}</div>
    <div class="card"><h3>Add an employee</h3><form id="f-emp"><div class="grid">
      ${field('employeeNo', 'Employee no.', 'required')}${field('firstName', 'First name', 'required')}${field('lastName', 'Last name', 'required')}${field('email', 'Email', 'type="email"')}
      ${pick('unitId', 'Unit', unitOpts(us))}${pick('managerId', 'Manager', [['', '(none)'], ...emps.map((e) => [e.id, `${e.first_name} ${e.last_name}`])])}${field('hireDate', 'Hire date', 'type="date"')}${field('nationality', 'Nationality (2-letter code, e.g. SA, IN)', 'maxlength="2" pattern="[A-Za-z]{2}"')}
      </div><div class="row"><button class="btn">Add employee</button></div></form></div>`;
  },
  async access() {
    const [users, roles, us] = await Promise.all([api('GET', '/v1/iam/users'), api('GET', '/v1/iam/roles'), units()]);
    return `<div class="card"><h3>Users</h3>${table(users)}
      <div class="row" style="flex-wrap:wrap">${users.filter((u) => u.status === 'active').map((u) => `<button class="btn sec" data-pw-reset="${esc(u.id)}" data-email="${esc(u.email)}">Set password: ${esc(u.email)}</button>`).join(' ')}</div>
      <form id="f-user"><div class="grid">${field('displayName', 'Name', 'required')}${field('email', 'Email', 'type="email" required')}${field('password', 'Password (12+ chars)', 'type="password"')}</div><div class="row"><button class="btn">Add user</button></div></form></div>
    <div class="card"><h3>Roles</h3>${table(roles.map((r) => ({ code: r.code, name: r.name, permissions: (r.permissions || []).filter((p) => p.permission).map((p) => p.permission).join(', ') })))}

const yearStart = () => `${new Date().getFullYear()}-01-01`;
const quarter = () => { const d = new Date(); const q = Math.floor(d.getMonth() / 3); const y = d.getFullYear();
  const from = new Date(Date.UTC(y, q * 3, 1)); const to = new Date(Date.UTC(y, q * 3 + 3, 0)); return [from.toISOString().slice(0, 10), to.toISOString().slice(0, 10)]; };

const itemOpts = (items, types) => items.filter((i) => i.status === 'active' && (!types || types.includes(i.item_type))).map((i) => [i.id, `${i.code} - ${i.name}`]);
const d10 = (v) => String(v ?? '').slice(0, 10);
const act = (label, attr, id, sec) => `<button class="btn${sec ? ' sec' : ''}" data-${attr}="${id}">${label}</button>`;
function opLines(n, items, taxOpts, withDiscount) {
  let h = '';
  for (let i = 0; i < n; i++) {
    h += `<div class="grid" style="margin-top:6px">${pick(`i${i}`, `Line ${i + 1}: item`, [['', '(no item / free text)'], ...itemOpts(items)])}${field(`d${i}`, 'Description', i ? '' : 'required')}
      ${field(`q${i}`, 'Quantity', `type="number" step="any" ${i ? '' : 'required value="1"'}`)}${field(`p${i}`, 'Unit price', `type="number" step="any" ${i ? '' : 'required'}`)}
      ${withDiscount ? field(`x${i}`, 'Discount (amount)', 'type="number" step="any" min="0"') : ''}${pick(`t${i}`, 'VAT', taxOpts)}</div>`;
  }
  return h;
}
function readLines(b, n, items) {
  const out = [];
  for (let i = 0; i < n; i++) {
    if (!b[`d${i}`] && !b[`i${i}`]) continue;
    const item = items.find((x) => x.id === b[`i${i}`]);
    out.push({ ...(item ? { itemId: item.id } : {}), description: b[`d${i}`] || item.name, quantity: Number(b[`q${i}`] || 1), unitPrice: Number(b[`p${i}`] || 0),
      taxCode: b[`t${i}`] || defaultTax(), ...(b[`x${i}`] ? { discount: Number(b[`x${i}`]) } : {}) });
  }
  return out;
}

    });
    const on = (attr, fn) => m.querySelectorAll(`[data-${attr}]`).forEach((el) => el.onclick = async () => { try { await fn(el.dataset[attr.replace(/-(\w)/g, (_, x) => x.toUpperCase())]); } catch (e) { toast(e.message, false); } });
    on('po-submit', async (id) => { const s = await api('POST', `/v1/pur/orders/${id}/submit`); ok(`${s.no} sent for approval`); });

      const o = await api('GET', `/v1/pur/orders/${id}`);

      const r = await api('POST', `/v1/pur/orders/${id}/receipts`, { date: today(), lines }); ok(`Received: ${r.no}`);
    });

      const p = await api('POST', `/v1/fin/invoices/${d.id}/post`); ok(`Bill posted: ${p.no}`);

      const q = await api('POST', `/v1/sal/companies/${c}/quotations`, body); ok(`Quotation ${q.quote_no} saved`);

    on('so-cancel', async (id) => { const o = await api('POST', `/v1/sal/orders/${id}/cancel`); ok(`Order ${o.status}`); });
    on('so-deliver', async (id) => { const d = await api('POST', `/v1/sal/orders/${id}/deliveries`, { date: today() }); ok(`Delivered: ${d.no}, cost ${money(d.cost)}`); });
    on('so-invoice', async (id) => { const d = await api('POST', `/v1/sal/orders/${id}/invoice`, { date: today() }); const p = await api('POST', `/v1/fin/invoices/${d.id}/post`); ok(`Invoice posted: ${p.no}`); });
  },
  async hr(m, ok) {

      await api('POST', '/v1/hr/contracts', body); ok('Contract added');
    });
    bindForm('f-leave', async (b) => { await api('POST', '/v1/hr/leave', b); ok('Leave requested; it now waits for approval'); });

    const sa = countryOf() !== 'AE';
    const si = SI_NAME[countryOf()] || 'Social insurance';
    const showRun = (r) => { $('#pr-out').innerHTML = `<h4>Payslips ${esc(r.period)}</h4>` + report(r.payslips, [['employee_no', 'No.'], ['employee_name', 'Employee'], ['unit_name', 'Cost center'], ['paid_days', 'Paid days'], ['basic', 'Basic', 1], ['allowances', 'Allowances', 1], ['additions', 'Additions', 1], ['deductions', 'Deductions', 1],
      ...(sa ? [['employee_contributions', `${si} (employee)`, 1], ['employer_contributions', `${si} (employer)`, 1]] : []), ['net', 'Net', 1], ['gratuity_balance', sa ? 'End-of-service accrued' : 'Gratuity accrued', 1]]); };

      ...(b.afterYears || b.employerPctAfter ? { afterYears: Number(b.afterYears), employerPctAfter: Number(b.employerPctAfter) } : {}) }); ok('Rate changed'); });
    const on = (attr, fn) => m.querySelectorAll(`[data-${attr}]`).forEach((el) => el.onclick = async () => { try { await fn(el.getAttribute(`data-${attr}`)); } catch (e) { toast(e.message, false); } });
    on('pr-view', async (id) => showRun(await api('GET', `/v1/hr/payroll/${id}`)));
    on('pr-post', async (id) => { await api('POST', `/v1/hr/payroll/${id}/post`); ok('Payroll posted to the ledger'); });
    on('k-settle', async (id) => { if (!confirm('Pay the end-of-service benefit from the bank account now?')) return; const r = await api('POST', `/v1/hr/contracts/${id}/settlement`, { date: today() }); ok(r.amount ? `Paid ${money(r.amount)} ${ccy()}` : r.note); });
    on('pr-pay', async (id) => {
      if (sa) { const r = await api('POST', `/v1/hr/payroll/${id}/pay`, { date: today() }); ok(`Salaries paid: ${money(r.total)} ${ccy()}${r.note ? `. Note: ${r.note}` : ''}`); return; }
      const employerId = prompt('MOHRE employer (establishment) id, 13 digits', localStorage.getItem('baatsEmployer') || ''); if (!employerId) return;
      const employerBankCode = prompt("Your bank's 9-digit routing code", localStorage.getItem('baatsEmployerBank') || ''); if (!employerBankCode) return;
      localStorage.setItem('baatsEmployer', employerId); localStorage.setItem('baatsEmployerBank', employerBankCode);
      const r = await api('POST', `/v1/hr/payroll/${id}/pay`, { date: today(), employerId, employerBankCode });
      download(r.fileName, r.content); ok(`Salaries paid. WPS file ${r.fileName} downloaded (${r.records} employees, ${money(r.total)} AED)`);
    });

});

/** Read a ZATCA QR code (base64 TLV) back into its fields. */
function readQr(b64) { const b = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); const out = []; for (let i = 0; i < b.length;) { const len = b[i + 1]; out.push(new TextDecoder().decode(b.slice(i + 2, i + 2 + len))); i += 2 + len; } return out; }

  step('E-invoicing: seller details and the first e-invoice...');
  await api('PATCH', `/v1/fin/companies/${co}`, { street: 'Sheikh Zayed Road, Tower 1', city: 'Dubai', emirate: 'DXB', tradeLicenceNo: 'DED-123456', licenceAuthority: 'Dubai DET', iban: 'AE070331234567890123456' });
  const parties = await api('GET', '/v1/mdm/parties');
  const cust = parties.find((p) => p.code === 'DEMO-C1');
  await api('PATCH', `/v1/mdm/parties/${cust.id}`, { attributes: { street: 'Al Wasl Road 12', city: 'Dubai', emirate: 'DXB', email: 'accounts@gulfretail.example' } });
  const docs = await api('GET', `/v1/fin/companies/${co}/einvoices`);
  for (const d of docs.filter((x) => !x.einvoice_id)) {
    const chk = await api('GET', `/v1/fin/invoices/${d.invoice_id}/einvoice-check`);
    if (chk.ready) await api('POST', `/v1/fin/invoices/${d.invoice_id}/einvoice`);
  }
  step('Bank: importing a statement and reconciling...');
  const rec = await api('GET', `/v1/fin/companies/${co}/bank-reconciliation?bankAccount=1010&asOf=${today()}`);
  const dmy = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}`;
  const rows = rec.inLedgerOnly.map((l) => `${dmy(d10(l.date))},"${String(l.memo).replace(/"/g, "'")}",${l.amount.toFixed(2)},`);
  rows.push(`${dmy(today())},Monthly account fee,-26.25,FEE`);
  if (rows.length > 1) await api('POST', `/v1/fin/companies/${co}/bank-statements`, { bankAccount: '1010', fileName: 'demo-statement.csv', csv: 'Date,Description,Amount,Reference\n' + rows.join('\n') + '\n' });
  const after = await api('GET', `/v1/fin/companies/${co}/bank-reconciliation?bankAccount=1010&asOf=${today()}`);
  for (const l of after.onStatementOnly) if (/fee/i.test(l.description)) await api('POST', `/v1/fin/bank-lines/${l.id}/post`, { account: '5900', memo: 'Bank charges' });
  step('Fixed assets: registering a vehicle and running depreciation...');
  const list = await api('GET', `/v1/fin/companies/${co}/assets`);
  if (!list.find((a) => a.code === 'DEMO-VAN')) {
    await api('POST', `/v1/fin/companies/${co}/assets`, { code: 'DEMO-VAN', name: 'Delivery van', category: 'Vehicles', acquisitionDate: yearStart(), usefulLifeMonths: 60, cost: 90000, residualValue: 15000 });
    const now = new Date();
    for (let mth = 1; mth <= now.getMonth() + 1; mth++) await api('POST', `/v1/fin/companies/${co}/depreciation`, { period: `${now.getFullYear()}-${String(mth).padStart(2, '0')}` }).catch(() => {});
  }
}

    <div class="card"><h3>Vehicles</h3>${vs.length ? '<div class="tbl"><table><tr><th>code</th><th>plate</th><th>vehicle</th><th>driver</th><th style="text-align:right">odometer</th><th>registration</th><th>insurance</th><th>status</th><th></th></tr>' + vs.map((v) => `<tr><td>${esc(v.code)}</td><td>${esc(v.plate_no)}</td><td>${esc([v.make, v.model, v.year].filter(Boolean).join(' '))}</td><td>${esc(v.driver_name)}</td><td style="text-align:right">${Number(v.odometer).toLocaleString()}</td><td>${d10(v.registration_expiry)}</td><td>${d10(v.insurance_expiry)}</td><td>${esc(v.status)}</td><td>${act(v.id === S.vehicle ? 'Showing' : 'Open', 'veh-open', v.id, 1)}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No vehicles yet.</div>'}</div>
    ${sum ? `<div class="card"><h3>${esc(sum.vehicle.plate_no)} ${esc(sum.vehicle.make || '')} ${esc(sum.vehicle.model || '')}${sum.vehicle.asset_code ? ` <span class="pill">asset ${esc(sum.vehicle.asset_code)}</span>` : ''}</h3>
      <p>Fuel economy <b>${sum.litresPer100km ?? 'n/a'}</b> L/100 km · fuel cost <b>${money(sum.fuelCost)}</b> · maintenance parts <b>${money(sum.maintenanceCost)}</b> · cost per km <b>${sum.costPerKm ?? 'n/a'}</b></p>
      <h4>Fuel</h4>${report(sum.fuel.map((f) => ({ ...f, date: d10(f.date) })), [['date', 'Date'], ['odometer', 'Odometer'], ['litres', 'Litres'], ['station', 'Station'], ['vat_amount', 'VAT', 1], ['amount', 'Paid', 1]])}
      <h4>Trips</h4>${report(sum.trips.map((t) => ({ ...t, date: d10(t.date), km: +(t.end_km - t.start_km).toFixed(1) })), [['date', 'Date'], ['purpose', 'Purpose'], ['project_code', 'Project'], ['start_km', 'From km'], ['end_km', 'To km'], ['km', 'Distance']])}</div>` : ''}
    ${active.length ? `<div class="card"><h3>Log fuel</h3><p class="muted">Posts the cost to 5610 on the vehicle's cost center and reclaims the VAT (it appears in the VAT return).</p><form id="f-fuel"><div class="grid">${pick('vehicleId', 'Vehicle', active.map((v) => [v.id, v.plate_no]))}${field('date', 'Date', `type="date" required value="${today()}"`)}${field('odometer', 'Odometer', 'type="number" step="0.1" min="0" required')}${field('litres', 'Litres', 'type="number" step="0.01" min="0.01" required')}${field('amount', 'Paid incl. VAT', 'type="number" step="0.01" min="0.01" required')}${field('vatAmount', 'VAT on the receipt', 'type="number" step="0.01" min="0"')}${field('station', 'Station')}${pick('paidFrom', 'Paid from', accountOpts(payFrom))}</div><div class="row"><button class="btn sec">Log fuel</button></div></form>
      <h4>Log a trip</h4><form id="f-trip"><div class="grid">${pick('vehicleId', 'Vehicle', active.map((v) => [v.id, v.plate_no]))}${field('date', 'Date', `type="date" required value="${today()}"`)}${field('endKm', 'Odometer at the end', 'type="number" step="0.1" min="0" required')}${field('purpose', 'Purpose', 'required')}</div><div class="row"><button class="btn sec">Log trip</button></div></form></div>` : ''}
    <div class="card"><h3>Add a vehicle</h3><form id="f-veh"><div class="grid">${field('code', 'Code', 'required')}${field('plateNo', 'Plate', 'required')}${field('make', 'Make')}${field('model', 'Model')}${field('year', 'Year', 'type="number" min="1950" max="2100"')}${pick('fuelType', 'Fuel', [['petrol', 'Petrol'], ['diesel', 'Diesel'], ['hybrid', 'Hybrid'], ['electric', 'Electric']])}
      ${pick('assetId', 'Booked as fixed asset', [['', '(not linked)'], ...fas.filter((a) => a.status === 'active').map((a) => [a.id, `${a.code} ${a.name}`])])}${pick('unitId', 'Cost center', [['', '(from the asset, or none)'], ...unitOpts(us)])}${pick('driverEmployeeId', 'Driver', [['', '(none)'], ...empOpts(emps)])}
      ${field('odometer', 'Odometer now', 'type="number" step="0.1" min="0"')}${field('registrationExpiry', 'Registration expires', 'type="date"')}${field('insuranceExpiry', 'Insurance expires', 'type="date"')}${field('insurancePolicy', 'Insurance policy')}</div><div class="row"><button class="btn">Add vehicle</button></div></form></div>`;

Object.assign(after, {
  async projects(m, ok) {
    bindCompanyPick();
    bindForm('f-project', async (b) => { await api('POST', `/v1/prj/companies/${S.company}/projects`, num(b, 'defaultBillRate', 'contractValue', 'budgetCost', 'budgetHours')); ok('Project created'); });
    bindForm('f-member', async (b) => { await api('POST', `/v1/prj/projects/${S.project}/members`, num(b, 'billRate')); ok('Added to the team'); });
    bindForm('f-milestone', async (b) => { await api('POST', `/v1/prj/projects/${S.project}/milestones`, num(b, 'amount')); ok('Milestone added'); });
    bindForm('f-time', async (b) => { await api('POST', '/v1/prj/timesheets', num(b, 'hours')); ok('Time logged'); });
    onAct(m, 'prj-open', async (id) => { S.project = id; show('projects'); });
    onAct(m, 'ms-reached', async (id) => { await api('POST', `/v1/prj/milestones/${id}/reached`, { date: today() }); ok('Milestone reached: it will be on the next invoice'); });
    onAct(m, 'prj-invoice', async (id) => { const i = await api('POST', `/v1/prj/projects/${id}/invoice`, { date: today() }); ok(`Draft invoice for ${money(i.gross_total)} ${i.currency} is under Finance: sales and purchases`); });
    onAct(m, 'prj-close', async (id) => { if (!confirm('Close the project? No more time can be logged.')) return; await api('PATCH', `/v1/prj/projects/${id}`, { status: 'closed' }); ok('Project closed'); });
    const picked = () => [...m.querySelectorAll('[data-ts]')].filter((x) => x.checked).map((x) => x.dataset.ts);
    const ap = $('#ts-approve'); if (ap) ap.onclick = async () => { try { const r = await api('POST', '/v1/prj/timesheets/approve', { ids: picked() }); ok(`Approved ${r.approved}; cost posted to the projects`); } catch (e) { toast(e.message, false); } };
    const rj = $('#ts-reject'); if (rj) rj.onclick = async () => { try { const r = await api('POST', '/v1/prj/timesheets/reject', { ids: picked() }); ok(`Rejected ${r.rejected}`); } catch (e) { toast(e.message, false); } };
  },
  async manufacturing(m, ok) {
    bindCompanyPick();
    const out = $('#mfg-out');
    const showOut = (o) => { out.style.display = 'block'; out.textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 2); };
    bindForm('f-wc', async (b) => { await api('POST', `/v1/mfg/companies/${S.company}/work-centers`, num(b, 'hourlyRate')); ok('Work center added'); });
    bindForm('f-reorder', async (b) => { await api('PUT', `/v1/inv/companies/${S.company}/reorder-rules`, num(b, 'minQty', 'reorderQty')); ok('Saved'); });
    bindForm('f-wo', async (b) => { await api('POST', `/v1/mfg/companies/${S.company}/work-orders`, { ...num(b, 'qty'), date: today() }); ok('Work order created'); });
    bindForm('f-bom', async (b) => {
      const [items, wcs] = await Promise.all([api('GET', '/v1/mdm/items'), api('GET', `/v1/mfg/companies/${S.company}/work-centers`)]);
      const byCode = (code) => { const i = items.find((x) => x.code.toLowerCase() === code.toLowerCase()); if (!i) throw new Error(`No item with code ${code}`); return i.id; };
      const lines = b.lines.split('\n').map((l) => l.trim()).filter(Boolean).map((l) => { const [code, qty, scrap] = l.split(/\s+/); return { itemId: byCode(code), qty: Number(qty), ...(scrap ? { scrapPct: Number(scrap) } : {}) }; });
      const operations = (b.operations || '').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
        const [seq, wc, setup, run, ...name] = l.split(/\s+/); const w = wcs.find((x) => x.code.toLowerCase() === wc.toLowerCase()); if (!w) throw new Error(`No work center ${wc}`);
        return { seq: Number(seq), workCenterId: w.id, setupMinutes: Number(setup), runMinutes: Number(run), name: name.join(' ') || 'Operation' };
      });
      await api('POST', `/v1/mfg/companies/${S.company}/boms`, { itemId: b.itemId, code: b.code, outputQty: Number(b.outputQty || 1), lines, ...(operations.length ? { operations } : {}) }); ok('Bill of materials saved');
    });
    const mr = $('#mrp-run'); if (mr) mr.onclick = async () => { try { S.mrp = await api('GET', `/v1/mfg/companies/${S.company}/mrp`); show('manufacturing'); } catch (e) { toast(e.message, false); } };
    onAct(m, 'mrp-make', async (itemId, el) => {
      const whs = await api('GET', `/v1/inv/companies/${S.company}/warehouses`);
      await api('POST', `/v1/mfg/companies/${S.company}/work-orders`, { itemId, qty: Number(el.dataset.qty), warehouseId: whs[0].id, date: today() });
      S.mrp = await api('GET', `/v1/mfg/companies/${S.company}/mrp`); ok('Work order created');
    });
    onAct(m, 'bom-show', async (id) => { const b = await api('GET', `/v1/mfg/boms/${id}`); showOut(`${b.code}: makes ${+b.output_qty} ${b.item_code}\n\nComponents\n` + b.lines.map((l) => `  ${l.item_code} ${+l.qty}${+l.scrap_pct ? ` (+${+l.scrap_pct}% scrap)` : ''}`).join('\n') + (b.operations.length ? '\n\nRouting\n' + b.operations.map((o) => `  ${o.seq} ${o.name} at ${o.work_center_code}: setup ${+o.setup_minutes} min, ${+o.run_minutes} min per unit`).join('\n') : '')); });
    onAct(m, 'bom-cost', async (itemId) => { const c = await api('GET', `/v1/mfg/companies/${S.company}/items/${itemId}/cost`); showOut(`Standard cost of one unit at today's average costs\n  material ${money(c.material)}\n  labour and overhead ${money(c.conversion)}\n  total ${money(c.total)}`); });
    onAct(m, 'wo-release', async (id) => { await api('POST', `/v1/mfg/work-orders/${id}/release`); ok('Released'); });
    onAct(m, 'wo-cancel', async (id) => { await api('POST', `/v1/mfg/work-orders/${id}/cancel`); ok('Cancelled'); });
    onAct(m, 'wo-issue', async (id) => { const r = await api('POST', `/v1/mfg/work-orders/${id}/issue`, { date: today() }); ok(`Materials issued: ${money(r.value)}`); });
    onAct(m, 'wo-complete', async (id) => {
      const wo = await api('GET', `/v1/mfg/work-orders/${id}`);
      const q = prompt(`Good quantity made (ordered ${+wo.qty})`, String(+wo.qty)); if (q === null) return;
      const r = await api('POST', `/v1/mfg/work-orders/${id}/complete`, { date: today(), qty: Number(q.trim() || wo.qty) }); ok(`Completed: ${+r.completed_qty} at ${money(r.unit_cost)} each`);
    });
    onAct(m, 'wo-show', async (id) => { const w = await api('GET', `/v1/mfg/work-orders/${id}`); showOut(`${w.no} ${w.item_code}: ${w.status}, made ${w.completed_qty ?? 0} of ${+w.qty}, unit cost ${w.unit_cost ?? 'n/a'}\n\nMaterials\n` + w.materials.map((x) => `  ${x.item_code} needed ${+x.required_qty}, issued ${+x.issued_qty} (${money(x.issued_value)})`).join('\n') + (w.operations.length ? '\n\nOperations\n' + w.operations.map((o) => `  ${o.seq} ${o.name} at ${o.work_center_code}: planned ${+o.planned_minutes} min, actual ${o.actual_minutes ?? '-'} min, ${money(o.cost)}`).join('\n') : '')); });
  },
  async maintenance(m, ok) {
    bindCompanyPick();
    const target = (b) => { const [k, id] = b.target.split(':'); delete b.target; return { ...b, ...(k === 'a' ? { assetId: id } : { vehicleId: id }) }; };
    bindForm('f-plan', async (b) => { const body = num(target(b), 'intervalDays', 'intervalKm'); if (!body.intervalDays) delete body.firstDueDate; await api('POST', `/v1/mnt/companies/${S.company}/plans`, body); ok('Plan added'); });
    bindForm('f-mwo', async (b) => { await api('POST', `/v1/mnt/companies/${S.company}/work-orders`, target(b)); ok('Work order created'); });
    const g = $('#mnt-generate'); if (g) g.onclick = async () => { try { const r = await api('POST', `/v1/mnt/companies/${S.company}/generate`, { asOf: today() }); ok(`${r.length} work orders raised`); } catch (e) { toast(e.message, false); } };
    onAct(m, 'mwo-start', async (id) => { await api('POST', `/v1/mnt/work-orders/${id}/start`); ok('Started'); });
    onAct(m, 'mwo-cancel', async (id) => { const r = prompt('Why cancel?'); if (!r) return; await api('POST', `/v1/mnt/work-orders/${id}/cancel`, { reason: r }); ok('Cancelled'); });
    onAct(m, 'mwo-parts', async (id) => {
      const wh = $('#mnt-wh')?.value; if (!wh) throw new Error('Add a warehouse under Inventory first');
      const spec = prompt('Parts used, as ITEM-CODE quantity (several separated by commas)', ''); if (!spec) return;
      const items = await api('GET', '/v1/mdm/items');
      const lines = spec.split(',').map((x) => x.trim()).filter(Boolean).map((x) => { const [code, qty] = x.split(/\s+/); const i = items.find((y) => y.code.toLowerCase() === code.toLowerCase()); if (!i) throw new Error(`No item ${code}`); return { itemId: i.id, qty: Number(qty || 1) }; });
      const r = await api('POST', `/v1/mnt/work-orders/${id}/parts`, { warehouseId: wh, date: today(), lines }); ok(`Parts issued; parts so far ${money(r.parts_cost)}`);
    });
    onAct(m, 'mwo-done', async (id) => {
      const res = prompt('What was done?'); if (!res) return;
      const w = await api('GET', `/v1/mnt/work-orders/${id}`);
      const body = { date: today(), resolution: res };
      if (w.vehicle_id) { const km = prompt('Odometer reading now (blank to keep)'); if (km) body.odometer = Number(km); }
      const h = prompt('Downtime in hours (optional)'); if (h) body.downtimeHours = Number(h);
      await api('POST', `/v1/mnt/work-orders/${id}/complete`, body); ok('Done; the plan moves to its next date');
    });
  },
  async fleet(m, ok) {
    bindCompanyPick();
    bindForm('f-veh', async (b) => { await api('POST', `/v1/flt/companies/${S.company}/vehicles`, num(b, 'year', 'odometer')); ok('Vehicle added'); });
    bindForm('f-fuel', async (b) => { const id = b.vehicleId; delete b.vehicleId; await api('POST', `/v1/flt/vehicles/${id}/fuel`, num(b, 'odometer', 'litres', 'amount', 'vatAmount')); ok('Fuel posted'); });
    bindForm('f-trip', async (b) => { const id = b.vehicleId; delete b.vehicleId; await api('POST', `/v1/flt/vehicles/${id}/trips`, num(b, 'endKm')); ok('Trip logged'); });
    onAct(m, 'veh-open', async (id) => { S.vehicle = id; show('fleet'); });
  },
});

async function loadPhase3Demo(step, co, root) {
  const d = today();
  const parties = await api('GET', '/v1/mdm/parties');
  const cust = parties.find((p) => p.code === 'DEMO-C1');
  const emps = await api('GET', '/v1/org/employees');
  const e1 = emps.find((e) => e.employee_no === 'DEMO-001'), e2 = emps.find((e) => e.employee_no === 'DEMO-002');
  const projects = await api('GET', `/v1/prj/companies/${co}/projects`);
  if (!projects.find((p) => p.code === 'DEMO-P1')) {
    step('Projects: a client project with a team, timesheets and an invoice...');
    const p = await api('POST', `/v1/prj/companies/${co}/projects`, { code: 'DEMO-P1', name: 'Showroom fit-out', customerId: cust.id, billing: 'time_material',
      defaultBillRate: 250, budgetCost: 20000, budgetHours: 200, startDate: yearStart(), managerEmployeeId: e1.id });
    await api('POST', `/v1/prj/projects/${p.id}/members`, { employeeId: e1.id, role: 'Project lead', billRate: 400 });
    await api('POST', `/v1/prj/projects/${p.id}/members`, { employeeId: e2.id, role: 'Designer' });
    const ts = [];
    for (const [e, h, w] of [[e1, 6, 'Client workshop'], [e2, 8, 'Layout drawings'], [e1, 4, 'Supplier meetings']]) ts.push((await api('POST', '/v1/prj/timesheets', { projectId: p.id, employeeId: e.id, date: d, hours: h, description: w })).id);
    await api('POST', '/v1/prj/timesheets/approve', { ids: ts });
    const inv = await api('POST', `/v1/prj/projects/${p.id}/invoice`, { date: d });
    await api('POST', `/v1/fin/invoices/${inv.id}/post`);
    const fp = await api('POST', `/v1/prj/companies/${co}/projects`, { code: 'DEMO-P2', name: 'ERP rollout (fixed price)', customerId: cust.id, billing: 'fixed_price', contractValue: 60000, startDate: yearStart() });
    const m1 = await api('POST', `/v1/prj/projects/${fp.id}/milestones`, { name: 'Design signed off', amount: 20000 });
    await api('POST', `/v1/prj/projects/${fp.id}/milestones`, { name: 'Go-live', amount: 40000 });
    await api('POST', `/v1/prj/milestones/${m1.id}/reached`, { date: d });
  }

  const boms = await api('GET', `/v1/mfg/companies/${co}/boms`);
  if (!boms.find((b) => b.code === 'BOM-DESK')) {
    step('Manufacturing: a desk made from parts, a work order and MRP...');
    const wh = (await api('GET', `/v1/inv/companies/${co}/warehouses`)).find((w) => w.code === 'MAIN');
    let items = await api('GET', '/v1/mdm/items');
    const item = async (code, name) => items.find((i) => i.code === code) || api('POST', '/v1/mdm/items', { code, name, itemType: 'stock', baseUom: 'EA', attributes: code === 'DEMO-DESK' ? { revenue_account: '4200' } : {} });
    const desk = await item('DEMO-DESK', 'Office desk'), top = await item('DEMO-TOP', 'Desk top, oak'), leg = await item('DEMO-LEG', 'Steel leg'), screw = await item('DEMO-SCREW', 'Screw M8');
    const filter = await item('DEMO-FILTER', 'Oil filter (spare part)');
    await api('POST', `/v1/inv/companies/${co}/opening-stock`, { warehouseId: wh.id, date: yearStart(), lines: [{ itemId: top.id, qty: 10, unitCost: 180 }, { itemId: leg.id, qty: 30, unitCost: 25 }, { itemId: screw.id, qty: 500, unitCost: 0.2 }, { itemId: filter.id, qty: 12, unitCost: 35 }] });
    const wc = await api('POST', `/v1/mfg/companies/${co}/work-centers`, { code: 'ASM', name: 'Assembly bench', hourlyRate: 90 });
    await api('POST', `/v1/mfg/companies/${co}/boms`, { itemId: desk.id, code: 'BOM-DESK', lines: [{ itemId: top.id, qty: 1 }, { itemId: leg.id, qty: 4 }, { itemId: screw.id, qty: 16, scrapPct: 5 }],
      operations: [{ seq: 10, name: 'Assemble and inspect', workCenterId: wc.id, setupMinutes: 20, runMinutes: 40 }] });
    const wo = await api('POST', `/v1/mfg/companies/${co}/work-orders`, { itemId: desk.id, qty: 4, warehouseId: wh.id, date: d });
    await api('POST', `/v1/mfg/work-orders/${wo.id}/release`);
    await api('POST', `/v1/mfg/work-orders/${wo.id}/complete`, { date: d });
    await api('PUT', `/v1/inv/companies/${co}/reorder-rules`, { warehouseId: wh.id, itemId: desk.id, minQty: 10 });
    await api('PUT', `/v1/inv/companies/${co}/reorder-rules`, { warehouseId: wh.id, itemId: leg.id, minQty: 20, reorderQty: 50 });
  }

  const vs = await api('GET', `/v1/flt/companies/${co}/vehicles`);
  if (!vs.find((v) => v.code === 'DEMO-V1')) {
    step('Fleet and maintenance: the van, fuel, a trip and its service plan...');
    const van = (await api('GET', `/v1/fin/companies/${co}/assets`)).find((a) => a.code === 'DEMO-VAN');
    const exp = new Date(); exp.setUTCDate(exp.getUTCDate() + 20);
    const v = await api('POST', `/v1/flt/companies/${co}/vehicles`, { code: 'DEMO-V1', plateNo: 'DXB K 48213', make: 'Toyota', model: 'Hiace', year: 2024, fuelType: 'diesel',
      ...(van ? { assetId: van.id } : {}), driverEmployeeId: e1.id, odometer: 18200, registrationExpiry: `${new Date().getFullYear() + 1}-01-31`, insuranceExpiry: exp.toISOString().slice(0, 10), insurancePolicy: 'OIC-778812' });
    await api('POST', `/v1/flt/vehicles/${v.id}/fuel`, { date: d, odometer: 18200, litres: 60, amount: 168, vatAmount: 8, station: 'ADNOC Al Quoz', paidFrom: '1010' });
    await api('POST', `/v1/flt/vehicles/${v.id}/trips`, { date: d, endKm: 18740, purpose: 'Deliveries to Abu Dhabi' });
    await api('POST', `/v1/flt/vehicles/${v.id}/fuel`, { date: d, odometer: 18740, litres: 54, amount: 151.2, vatAmount: 7.2, station: 'ENOC Mussafah', paidFrom: '1010' });
    await api('POST', `/v1/mnt/companies/${co}/plans`, { vehicleId: v.id, name: 'Oil and filter change', intervalKm: 10000 });
    await api('POST', `/v1/mnt/companies/${co}/plans`, { vehicleId: v.id, name: 'Annual inspection', intervalDays: 365, firstDueDate: d });
    await api('POST', `/v1/mnt/companies/${co}/generate`, { asOf: d });
    const wos = await api('GET', `/v1/mnt/companies/${co}/work-orders?status=open`);
    const insp = wos.find((w) => w.vehicle_id === v.id);
    const wh = (await api('GET', `/v1/inv/companies/${co}/warehouses`)).find((w) => w.code === 'MAIN');
    const filter = (await api('GET', '/v1/mdm/items')).find((i) => i.code === 'DEMO-FILTER');
    if (insp) {
      await api('POST', `/v1/mnt/work-orders/${insp.id}/parts`, { warehouseId: wh.id, date: d, lines: [{ itemId: filter.id, qty: 1 }] });
      await api('POST', `/v1/mnt/work-orders/${insp.id}/complete`, { date: d, resolution: 'Inspected, filter replaced', odometer: 18760, downtimeHours: 2 });
    }
    await api('POST', `/v1/mnt/companies/${co}/work-orders`, { vehicleId: v.id, kind: 'corrective', priority: 'high', description: 'Rear door does not lock', scheduledDate: d });
  }
}

const fileB64 = (f) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('Could not read the file')); r.readAsDataURL(f); });
const pickedFile = (el) => { const f = el.querySelector('input[type=file]')?.files?.[0]; if (!f) throw new Error('Choose a file'); if (f.size > 10 * 1024 * 1024) throw new Error('Files are limited to 10 MB'); return f; };
async function fileBody(el, b) { const f = pickedFile(el); delete b.file; return { ...b, fileName: f.name, contentType: f.type || 'application/octet-stream', contentBase64: await fileB64(f) }; }
async function downloadDoc(id, version) {
  const r = await fetch(`/v1/dms/documents/${id}/content${version ? `?version=${version}` : ''}`, { headers: { authorization: 'Bearer ' + S.token } });
  if (!r.ok) { let m = 'HTTP ' + r.status; try { m = (await r.json()).message || m; } catch { /* binary */ } throw new Error(m); }
  const name = (/filename="([^"]+)"/.exec(r.headers.get('content-disposition') || '') || [])[1] || 'document';
  const url = URL.createObjectURL(await r.blob()); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const fileField = (label = 'File (up to 10 MB)') => `<label>${label}<input type="file" name="file" required></label>`;
const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const when = (v) => (v ? new Date(v).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '');
const hhmm = (v) => new Date(v).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
const red = (s) => `<span style="color:var(--bad)">${s}</span>`;
const rootUnit = (us) => us.find((u) => u.depth === 0) || us[0];
const actionFields = (emps) => `<div class="grid">${field('actionTitle', 'Corrective action')}${pick('actionOwner', 'Owner', [['', '(choose)'], ...empOpts(emps)])}${field('actionDue', 'Due', `type="date" value="${today()}"`)}</div>`;
const takeActions = (b) => { const a = b.actionTitle ? [{ title: b.actionTitle, ownerEmployeeId: b.actionOwner, dueDate: b.actionDue }] : []; if (a.length && !b.actionOwner) throw new Error('Choose who owns the action'); delete b.actionTitle; delete b.actionOwner; delete b.actionDue; return a; };

    <div class="card"><h3>Non-conformance reports</h3><p class="muted">Scrap writes the stock off at average cost (Dr 5070, Cr 1300). Return to supplier does the same and drafts a supplier credit note at the billed price, so the claim offsets the write-off. Rework and use-as-is move no stock.</p>

      ${open.length ? `<h4>Decide a disposition</h4><form id="f-disp"><div class="grid">${pick('ncrId', 'NCR', open.map((n) => [n.id, `${n.no} ${n.item_code || ''} ${n.description}`]))}${pick('disposition', 'Disposition', [['scrap', 'Scrap'], ['return_to_supplier', 'Return to supplier'], ['rework', 'Rework'], ['use_as_is', 'Use as is']])}${field('rootCause', 'Root cause', 'required')}</div>${actionFields(emps)}<div class="row"><button class="btn sec">Record disposition</button></div></form>` : ''}
      <h4>Raise an NCR by hand</h4><form id="f-ncr"><div class="grid">${pick('itemId', 'Item', [['', '(none)'], ...itemOpts(items, ['stock'])])}${pick('warehouseId', 'Warehouse', [['', '(none)'], ...whs.map((w) => [w.id, w.code])])}${field('qty', 'Quantity affected', 'type="number" step="any" min="0"')}${pick('severity', 'Severity', [['minor', 'Minor'], ['major', 'Major'], ['critical', 'Critical']])}${field('description', 'Description', 'required')}</div><div class="row"><button class="btn sec">Raise NCR</button></div></form></div>
    <div class="card"><h3>Supplier quality this year</h3>${report(sq.map((s) => ({ ...s, rejectionPct: s.rejectionPct + '%' })), [['name', 'Supplier'], ['lots', 'Lots'], ['failed_lots', 'Failed lots'], ['inspected', 'Inspected'], ['rejected', 'Rejected'], ['rejectionPct', 'Rejection rate'], ['ncrs', 'NCRs']])}</div>
    <div class="card"><h3>Inspections</h3>${report(insp.map((x) => ({ ...x, qty_inspected: +x.qty_inspected, qty_rejected: +x.qty_rejected, inspected_on: d10(x.inspected_on), source: { 'pur.receipt': 'receipt', 'mfg.work_order': 'work order', 'inv.stock': 'stock' }[x.source_type] })), [['inspected_on', 'Date'], ['source', 'Source'], ['item_code', 'Item'], ['supplier_name', 'Supplier'], ['qty_inspected', 'Inspected'], ['qty_rejected', 'Rejected'], ['result', 'Result'], ['notes', 'Notes']])}</div>`;
  },

  async safety() {

      <p>${st.incidents} incidents: ${st.injuries} injuries (${st.lost_time_injuries} lost time, ${st.lost_days} days lost), ${st.near_misses} near misses, ${st.environmental} environmental · ${st.open} not closed</p></div>` : ''}
    <div class="card"><h3>Report an incident or near miss</h3><p class="muted">Anyone can report, whatever their permissions. Near misses are worth reporting: they are the cheapest lessons.</p><form id="f-inc"><div class="grid">${pick('unitId', 'Where (unit)', unitOpts(us))}${field('occurredAt', 'When', `type="datetime-local" required value="${local}"`)}${pick('kind', 'Kind', [['near_miss', 'Near miss'], ['injury', 'Injury'], ['property_damage', 'Property damage'], ['environmental', 'Environmental'], ['fire', 'Fire'], ['vehicle', 'Vehicle']])}${pick('severity', 'Severity', [['minor', 'Minor'], ['moderate', 'Moderate'], ['serious', 'Serious'], ['major', 'Major'], ['fatal', 'Fatal']])}${field('location', 'Exact location', 'required')}${field('description', 'What happened', 'required')}
      ${pick('employeeId', 'Person injured', [['', '(none)'], ...empOpts(emps)])}${pick('vehicleId', 'Vehicle', [['', '(none)'], ...vs.map((v) => [v.id, v.plate_no])])}${field('lostDays', 'Days lost', 'type="number" min="0" value="0"')}</div><div class="row"><button class="btn">Report</button></div></form></div>
    <div class="card"><h3>Incidents</h3>${incs.length ? '<div class="tbl"><table><tr><th>no</th><th>when</th><th>unit</th><th>kind</th><th>severity</th><th>where</th><th>what</th><th>person</th><th>days lost</th><th>status</th><th></th></tr>' + incs.map((i) => `<tr><td>${esc(i.no)}</td><td>${when(i.occurred_at)}</td><td>${esc(i.unit_code)}</td><td>${esc(i.kind)}</td><td>${esc(i.severity)}</td><td>${esc(i.location)}</td><td>${esc(i.description)}${i.root_cause ? `<div class="muted">Root cause: ${esc(i.root_cause)}</div>` : ''}</td><td>${esc(i.employee_name || '')}</td><td>${i.lost_days}</td><td>${esc(i.status)} ${d10(i.closed_on)}</td><td>${i.status === 'investigating' ? act('Close', 'inc-close', i.id) : ''}</td></tr>`).join('') + '</table></div>' : '<div class="empty">No incidents.</div>'}
      ${inv.length ? `<h4>Investigate</h4><p class="muted">Record the root cause and the corrective actions. An incident closes once its actions are verified; serious, major and fatal ones need at least one action.</p><form id="f-invest"><div class="grid">${pick('incidentId', 'Incident', inv.map((i) => [i.id, `${i.no} ${i.kind} ${i.description}`]))}${field('rootCause', 'Root cause', 'required')}${field('lostDays', 'Days lost (update)', 'type="number" min="0"')}</div>${actionFields(emps)}<div class="row"><button class="btn sec">Save investigation</button></div></form>` : ''}</div>`;
  },

      ${bookable.length ? `<h4>Book a space</h4><form id="f-book"><div class="grid">${pick('spaceId', 'Space', bookable.map((s) => [s.id, `${s.site_code} ${s.code} ${s.name} (${s.capacity})`]))}${field('day', 'Day', `type="date" required value="${S.facDate}"`)}${field('from', 'From', 'type="time" required value="09:00"')}${field('to', 'To', 'type="time" required value="10:00"')}${field('purpose', 'Purpose', 'required')}${field('attendees', 'People', 'type="number" min="1" value="1"')}</div><div class="row"><button class="btn">Book</button></div></form>` : ''}</div>
    ${util ? `<div class="card"><h3>Utilisation this month</h3><p class="muted">Share of bookable hours used (10 hours a day, 5 days a week).</p>${report(util.map((u) => ({ ...u, booked_hours: Math.round(u.booked_hours * 10) / 10, utilisationPct: u.utilisationPct + '%' })), [['code', 'Space'], ['name', 'Name'], ['kind', 'Kind'], ['bookings', 'Bookings'], ['booked_hours', 'Hours booked'], ['availableHours', 'Hours available'], ['utilisationPct', 'Used']])}</div>` : ''}
    <div class="card"><h3>Spaces</h3>${report(spaces, [['site_code', 'Site'], ['code', 'Code'], ['name', 'Name'], ['kind', 'Kind'], ['capacity', 'Capacity'], ['bookable', 'Bookable']])}
      <form id="f-space"><div class="grid">${pick('unitId', 'Site', unitOpts(us))}${field('code', 'Code', 'required')}${field('name', 'Name', 'required')}${pick('kind', 'Kind', [['meeting_room', 'Meeting room'], ['desk', 'Desk'], ['office', 'Office'], ['parking', 'Parking'], ['warehouse', 'Warehouse'], ['other', 'Other']])}${field('capacity', 'Capacity', 'type="number" min="1" value="1"')}${check('bookable', 'Bookable', true)}</div><div class="row"><button class="btn sec">Add space</button></div></form></div>`;
  },

Object.assign(after, {
  async documents(m, ok) {
    const out = $('#doc-out');
    bindForm('f-doc', async (b, el) => { await api('POST', '/v1/dms/documents', await fileBody(el, b)); ok('Uploaded'); });
    onAct(m, 'doc-get', async (id) => downloadDoc(id));
    onAct(m, 'doc-arch', async (id) => { if (!confirm('Archive this document? It stays readable but takes no new versions.')) return; await api('POST', `/v1/dms/documents/${id}/archive`); ok('Archived'); });
    onAct(m, 'doc-hist', async (id) => { const d = await api('GET', `/v1/dms/documents/${id}`); out.style.display = 'block'; out.textContent = `${d.title}\n\n` + d.versions.map((v) => `v${v.version}  ${v.file_name}  ${kb(v.size_bytes)}  ${when(v.uploaded_at)}${v.note ? '  ' + v.note : ''}\n    sha256 ${v.sha256}`).join('\n'); });
    const vf = $('#doc-ver-file');
    onAct(m, 'doc-ver', async (id) => { vf.dataset.doc = id; vf.value = ''; vf.click(); });
    if (vf) vf.onchange = async () => { try { const f = vf.files[0]; if (!f) return; if (f.size > 10 * 1024 * 1024) throw new Error('Files are limited to 10 MB');
      const note = prompt('What changed in this version? (optional)') || undefined;
      await api('POST', `/v1/dms/documents/${vf.dataset.doc}/versions`, { fileName: f.name, contentType: f.type || 'application/octet-stream', contentBase64: await fileB64(f), note }); ok('New version saved'); } catch (e) { toast(e.message, false); } };
  },
  async contracts(m, ok) {
    bindCompanyPick();
    bindForm('f-k', async (b) => { if (!b.autoRenew) delete b.renewalMonths; const k = await api('POST', `/v1/lgl/companies/${S.company}/contracts`, num(b, 'value', 'renewalMonths', 'noticeDays')); S.contract = k.id; ok('Draft saved: attach the signed copy, then send it for approval'); });
    bindForm('f-ob', async (b) => { await api('POST', `/v1/lgl/contracts/${S.contract}/obligations`, b); ok('Obligation added'); });
    bindForm('f-kdoc', async (b, el) => { await api('POST', '/v1/dms/documents', { ...(await fileBody(el, b)), unitId: S.company, category: 'contract', entityType: 'lgl.contract', entityId: S.contract, confidential: false }); ok('Attached'); });
    onAct(m, 'k-open', async (id) => { S.contract = id; show('contracts'); });
    onAct(m, 'k-submit', async (id) => { await api('POST', `/v1/lgl/contracts/${id}/submit`); ok('Sent for approval'); });
    onAct(m, 'k-term', async (id) => { const r = prompt('Why is the contract being terminated?'); if (!r) return; await api('POST', `/v1/lgl/contracts/${id}/terminate`, { date: today(), reason: r }); ok('Terminated'); });
    onAct(m, 'doc-get', async (id) => downloadDoc(id));
    onAct(m, 'ob-done', async (id) => { await api('POST', `/v1/lgl/obligations/${id}/done`, { date: today() }); ok('Done'); });
    onAct(m, 'ob-waive', async (id) => { await api('POST', `/v1/lgl/obligations/${id}/done`, { date: today(), waived: true }); ok('Waived'); });
    const rn = $('#k-renew'); if (rn) rn.onclick = async () => { try { const r = await api('POST', `/v1/lgl/companies/${S.company}/renewals`, { asOf: today() }); ok(`${r.renewed?.length ?? 0} renewed, ${r.expired?.length ?? 0} expired`); } catch (e) { toast(e.message, false); } };
  },
  async risk(m, ok) {
    bindForm('f-risk', async (b) => { await api('POST', '/v1/grc/risks', num(b, 'likelihood', 'impact', 'appetite')); ok('Risk added'); });
    bindForm('f-ctl', async (b) => { await api('POST', `/v1/grc/risks/${S.risk}/controls`, b); ok('Control added'); });
    bindForm('f-ctest', async (b) => { const id = b.controlId; delete b.controlId; const r = await api('POST', `/v1/grc/controls/${id}/tests`, num(b, 'sampleSize', 'exceptions')); ok(r.action ? `Recorded. A corrective action was raised${r.finding ? ', with an audit finding' : ''}` : 'Recorded'); });
    bindForm('f-comp', async (b) => { await api('POST', '/v1/grc/obligations', b); ok('Obligation added'); });
    onAct(m, 'risk-open', async (id) => { S.risk = id; show('risk'); });
    onAct(m, 'co-met', async (id) => { const o = await api('POST', `/v1/grc/obligations/${id}/met`, { date: today() }); ok(o.status === 'active' ? `Met; next due ${d10(o.next_due)}` : 'Met'); });
  },
  async audit(m, ok) {
    bindForm('f-eng', async (b) => { const e = await api('POST', '/v1/grc/engagements', b); S.engagement = e.id; ok('Engagement planned'); });
    bindForm('f-find', async (b) => { await api('POST', `/v1/grc/engagements/${S.engagement}/findings`, b); ok('Finding raised'); });
    m.querySelectorAll('form.f-resp').forEach((el) => el.addEventListener('submit', async (ev) => { ev.preventDefault(); try { const b = form(el); const actions = takeActions(b); if (!actions.length) throw new Error('Commit to at least one action'); await api('POST', `/v1/grc/findings/${el.dataset.finding}/response`, { response: b.response, actions }); ok('Response recorded'); } catch (e) { toast(e.message, false); } }));
    onAct(m, 'eng-open', async (id) => { S.engagement = id; show('audit'); });
    onAct(m, 'eng-adv', async (id, el) => {
      let body = {};
      if (/opinion/.test(el.textContent)) { const o = prompt('Opinion: satisfactory, needs_improvement or unsatisfactory', 'needs_improvement'); if (!o) return; body = { opinion: o.trim() }; }
      const e = await api('POST', `/v1/grc/engagements/${id}/advance`, body); ok(`Now ${e.status}`);
    });
  },
  async actions(m, ok) {

    onAct(m, 'a-ok', async (id) => { await api('POST', `/v1/grc/actions/${id}/verify`, { date: today(), accepted: true }); ok('Verified'); });
    onAct(m, 'a-back', async (id) => { const c = prompt('Why is it not done?'); if (!c) return; await api('POST', `/v1/grc/actions/${id}/verify`, { date: today(), accepted: false, comment: c }); ok('Sent back to the owner'); });
  },
  async servicedesk(m, ok) {
    bindForm('f-ticket', async (b) => { const t = await api('POST', '/v1/svc/tickets', num(b, 'priority')); S.ticket = t.id; ok(`Raised ${t.no}`); });

// ---------- Intelligence (Phase 5) ----------
const fmtKpi = (v, unit) => v === null || v === undefined ? 'n/a' : unit === 'money' ? money(v) : unit === 'pct' ? `${Number(v).toFixed(1)}%` : unit === 'days' ? `${v} days`
  : unit === 'ratio' ? Number(v).toFixed(2) : unit === 'tco2e' ? `${Number(v).toFixed(2)} t` : Number(v).toLocaleString();
const changeTag = (pct, better) => {
  if (pct === null || pct === undefined) return null;
  if (pct === 0) return '<span class="muted">no change</span>';
  const good = better === 'neutral' ? null : (pct > 0) === (better === 'up');
  return `<span style="color:${good === null ? 'var(--muted)' : good ? 'var(--ok)' : 'var(--bad)'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1)}%</span>`;
};
const MODULE_NAMES = { finance: 'Finance', purchasing: 'Purchasing', sales: 'Sales and CRM', inventory: 'Inventory', hr: 'People', projects: 'Projects', manufacturing: 'Manufacturing',
  maintenance: 'Maintenance', fleet: 'Fleet', 'service desk': 'Service desk', governance: 'Governance and risk', quality: 'Quality', safety: 'Health and safety', sustainability: 'Sustainability' };
const ragTag = (s) => s ? `<span class="rag rag-${s}">${{ green: '● On track', amber: '◐ At risk', red: '○ Off track' }[s]}</span>` : '<span class="muted">no data</span>';
const compact = (v) => { const a = Math.abs(v); return a >= 1e6 ? `${(v / 1e6).toFixed(1)}M` : a >= 1e3 ? `${(v / 1e3).toFixed(0)}k` : String(Math.round(v)); };
function niceStep(v) { const p = 10 ** Math.floor(Math.log10(v)); return [1, 2, 2.5, 5, 10].map((m) => m * p).find((x) => x >= v); }
function niceMax(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); return Math.ceil(v / p) * p; }
/** Line chart on one axis: series [{key,label,cls}], points [{month,...}]. Hover columns carry a tooltip. */
function lineChart(points, series, title, fmt = money) {
  const W = 640, H = 220, L = 52, R = 12, T = 12, B = 26, w = W - L - R, h = H - T - B;
  const vals = points.flatMap((p) => series.map((s) => p[s.key]));
  const vmax = Math.max(0, ...vals), vmin = Math.min(0, ...vals), step = niceStep((vmax - vmin) / 4 || 1);
  const hi = Math.ceil(vmax / step) * step || step, lo = Math.floor(vmin / step) * step;
  const x = (i) => L + (points.length === 1 ? w / 2 : (i * w) / (points.length - 1)), y = (v) => T + h - ((v - lo) / (hi - lo)) * h;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  const grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="grid${v === 0 ? ' zero' : ''}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="axis">${compact(v)}</text>`).join('');
  const xl = points.map((p, i) => (i % 2 === (points.length - 1) % 2 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" class="axis">${p.month.slice(2).replace('-', '/')}</text>` : '')).join('');
  const lines = series.map((s) => `<polyline fill="none" class="ln ${s.cls}" points="${points.map((p, i) => `${x(i)},${y(p[s.key])}`).join(' ')}"/>`
    + `<circle class="dot ${s.cls}" cx="${x(points.length - 1)}" cy="${y(points.at(-1)[s.key])}" r="4"/>`).join('');
  const hits = points.map((p, i) => `<rect class="hit" x="${x(i) - w / points.length / 2}" y="${T}" width="${w / points.length}" height="${h}" data-tip="${esc(`<b>${p.month}</b>` + series.map((s) => `<div><i class="sw ${s.cls}"></i>${s.label}: ${fmt(p[s.key])}</div>`).join(''))}" data-x="${x(i)}"/>`).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i class="sw ${s.cls}"></i>${s.label}</span>`).join('')}</div>` : '';
  return `<div class="chart"><div class="ctitle">${title}</div>${legend}<div class="cwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}${xl}${lines}<line class="xhair" y1="${T}" y2="${T + h}" x1="0" x2="0" style="display:none"/>${hits}</svg><div class="tip" style="display:none"></div></div></div>`;
}
function bindCharts(m) {
  m.querySelectorAll('.cwrap').forEach((c) => {
    const tip = c.querySelector('.tip'), xh = c.querySelector('.xhair');
    c.querySelectorAll('[data-tip]').forEach((r) => {
      r.addEventListener('mouseenter', () => { tip.innerHTML = r.dataset.tip; tip.style.display = 'block'; if (xh && r.dataset.x) { xh.setAttribute('x1', r.dataset.x); xh.setAttribute('x2', r.dataset.x); xh.style.display = ''; } });
      r.addEventListener('mousemove', (e) => { const b = c.getBoundingClientRect(); tip.style.left = Math.min(e.clientX - b.left + 12, b.width - 190) + 'px'; tip.style.top = (e.clientY - b.top + 12) + 'px'; });
      r.addEventListener('mouseleave', () => { tip.style.display = 'none'; if (xh) xh.style.display = 'none'; });
    });
  });
}
/** Horizontal bars for a ranked list (one series, so one colour). */
function barList(rows, label, value, title, fmt = money) {
  if (!rows.length) return `<div class="chart"><div class="ctitle">${title}</div><div class="empty">Nothing yet.</div></div>`;
  const max = Math.max(...rows.map((r) => Math.abs(r[value]))) || 1;
  return `<div class="chart"><div class="ctitle">${title}</div><div class="cwrap">${rows.map((r) => `<div class="bar" data-tip="${esc(`<b>${esc(r[label])}</b><div>${fmt(r[value])}</div>`)}"><span class="bl">${esc(r[label])}</span><span class="bt"><span class="bf" style="width:${Math.max(1, Math.abs(r[value]) / max * 100)}%"></span></span><span class="bv">${fmt(r[value])}</span></div>`).join('')}<div class="tip" style="display:none"></div></div></div>`;
}

// ---------- AI assistant (Phase 5b) ----------
// Assistant answers are model text: escape everything, then allow a small, safe subset of Markdown.
function mdLite(src) {
  const inline = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = String(src ?? '').replace(/\r/g, '').split('\n');
  let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i].trim().slice(1, -1).split('|').map((c) => c.trim())); i++; }
      const body = rows.filter((r) => !r.every((c) => /^:?-{2,}:?$/.test(c)));
      const num = (c) => /^[-+]?[\d,]+(\.\d+)?%?$/.test(c.replace(/[A-Z]{3}\s?/, ''));
      out += '<div class="tbl"><table>' + body.map((r, n) => '<tr>' + r.map((c) => n === 0 ? `<th>${inline(c)}</th>` : `<td${num(c) ? ' class="num"' : ''}>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table></div>';
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, '')); i++; }
      out += `<${ordered ? 'ol' : 'ul'}>${items.map((x) => `<li>${inline(x)}</li>`).join('')}</${ordered ? 'ol' : 'ul'}>`;
      continue;
    }
    const h = l.match(/^#{1,4}\s+(.*)$/);
    if (h) { out += `<p><b>${inline(h[1])}</b></p>`; i++; continue; }
    if (!l.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^\s*(\||[-*]\s|\d+\.\s|#)/.test(lines[i])) { para.push(inline(lines[i])); i++; }
    if (para.length) out += `<p>${para.join('<br>')}</p>`; else { out += `<p>${inline(l)}</p>`; i++; }
  }
  return out;
}
const TOOL_LABELS = { list_kpis: 'Listed the KPIs', get_kpi: 'Looked up a KPI', kpi_trend: 'Looked up a KPI trend', kpi_breakdown: 'Broke down a KPI', executive_dashboard: 'Read the dashboard', trial_balance: 'Read the trial balance',
  profit_and_loss: 'Read the profit and loss', balance_sheet: 'Read the balance sheet', ageing: 'Read the ageing', find_partners: 'Searched customers and suppliers', stock_levels: 'Read stock levels',
  list_datasets: 'Listed report datasets', run_report: 'Ran a report', anomaly_checks: 'Ran the anomaly checks', esg_report: 'Read the ESG report', strategy_scorecard: 'Read the scorecard', my_tickets: 'Listed tickets' };
function aiCall(c) {
  if (c.kind === 'read') {
    const label = TOOL_LABELS[c.tool] || c.summary;
    return `<span class="ai-chip ${c.status === 'failed' ? 'bad' : ''}" title="${esc(c.summary)}${c.error ? ' · ' + esc(c.error) : ''}">${c.status === 'failed' ? '✕' : '✓'} ${esc(label)}${c.status === 'failed' ? ' (not possible)' : ''}</span>`;
  }
  const state = { pending: 'Waiting for you', done: 'Done', rejected: 'You rejected this', failed: 'Could not be done' }[c.status];
  return `<div class="ai-change ${c.status}"><div><b>Proposed change</b> · <span class="muted">${esc(state)}</span></div><div>${esc(c.summary)}</div>
    ${c.status === 'pending' ? `<div class="row"><button class="btn" data-ai-ok="${c.id}">Confirm</button><button class="btn sec" data-ai-no="${c.id}">Reject</button></div>` : ''}
    ${c.error ? `<div class="ai-err">${esc(c.error)}</div>` : ''}${c.status === 'done' && c.result?.no ? `<div class="muted">Reference ${esc(c.result.no)}</div>` : ''}</div>`;
}
function aiThread(conv) {
  if (!conv.messages.length) return `<div class="empty">Ask about sales, cash, overdue customers, stock, emissions or anything else in your books. For example: <i>How did revenue this quarter compare with last quarter?</i> or <i>Which customers are more than 60 days overdue?</i></div>`;
  // One bubble per answer: consecutive assistant steps (look-ups, then the reply) are shown together.
  const groups = [];
  for (const m of conv.messages) { const g = groups[groups.length - 1]; if (m.role === 'assistant' && g?.role === 'assistant') g.parts.push(m); else groups.push({ role: m.role, parts: [m] }); }
  const part = (m) => `${m.toolCalls.filter((c) => c.kind === 'read').map(aiCall).join('')}${m.text ? mdLite(m.text) : ''}${m.notice ? `<p class="muted">${esc(m.notice)}</p>` : ''}${m.toolCalls.filter((c) => c.kind === 'change').map(aiCall).join('')}`;
  return groups.map((g) => g.role === 'user'
    ? `<div class="ai-msg me"><div class="ai-bubble">${esc(g.parts[0].text).replace(/\n/g, '<br>')}</div></div>`
    : `<div class="ai-msg"><div class="ai-bubble">${g.parts.map(part).join('')}</div></div>`).join('');
}

const PERIODS = [['this_month', 'This month'], ['last_month', 'Last month'], ['this_quarter', 'This quarter'], ['last_quarter', 'Last quarter'], ['this_year', 'This financial year'],
  ['last_year', 'Last financial year'], ['last_12_months', 'Last 12 months'], ['custom', 'Custom dates']];
const COMPARES = [['previous_period', 'Previous period'], ['previous_year', 'Same period last year'], ['none', 'No comparison']];
const optsHtml = (opts, v) => opts.map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${esc(t)}</option>`).join('');
const anaQuery = (extra = {}) => { const a = S.ana; const q = new URLSearchParams({ period: a.period, compare: a.compare, ...extra }); if (a.period === 'custom') { q.set('from', a.from); q.set('to', a.to); } return q; };
/** A small trend line for a tile: one series, no axes; the last point marked. */
function spark(points) {
  const v = points.map((p) => p.value ?? 0); if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), W = 120, H = 30, x = (i) => (i * W) / (v.length - 1), y = (n) => H - 3 - ((n - lo) / ((hi - lo) || 1)) * (H - 6);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${v.map((n, i) => `${x(i)},${y(n)}`).join(' ')}" vector-effect="non-scaling-stroke"/></svg>`;
}
function breakdownBars(b) {
  if (!b.rows.length) return '<div class="empty">Nothing in this period.</div>';
  const f = (v) => fmtKpi(v, b.unit === 'count' ? 'count' : b.unit === 'tco2e' ? 'tco2e' : 'money');
  const max = Math.max(...b.rows.map((r) => Math.abs(r.value))) || 1;
  return `<div class="cwrap">${b.rows.map((r) => `<div class="bar" data-tip="${esc(`<b>${esc(r.label)}</b><div>${f(r.value)}${r.share !== null ? ` · ${r.share}% of the total` : ''}</div>`)}"><span class="bl" title="${esc(r.label)}">${esc(r.label)}</span><span class="bt"><span class="bf" style="width:${Math.max(1, Math.abs(r.value) / max * 100)}%"></span></span><span class="bv">${f(r.value)}${r.share !== null ? `<span class="share">${r.share}%</span>` : ''}</span></div>`).join('')}<div class="tip" style="display:none"></div></div>`;
}

        ${d.breakdowns.length ? `<h4>Breakdown</h4><div class="tabs">${d.breakdowns.map((b) => `<button class="tab ${b === bd ? 'on' : ''}" data-ana-bd="${b.key}">${esc(b.title)}</button>`).join('')}</div>${breakdownBars(bd)}` : ''}
        ${d.records ? `<h4>${esc(d.records.title)}</h4><p class="muted">${d.records.total > d.records.rows.length ? `The largest ${d.records.rows.length} of ${d.records.total}.` : `${d.records.total} in all.`}</p>
